<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oshima Study Hub</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23A85578'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' font-family='Georgia,serif' font-weight='600' fill='%23FBF6F4'%3EO%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F3FA; --wash:#EEE3F5; --card:#FFFFFF;
    --line:#EEDFDB; --line2:#E4D2D5; --tint:#FAF3F1;
    --rose:#A85578; --rose-l:#F8E9F0; --rose-s:#C98BA6; --rose-hl:#EFC3D8;
    --lav:#9C86BE; --lav-l:#F1ECF7; --lav-hl:#D9C7EE;
    --sage:#4F8A6B; --sage-l:#EAF3ED; --sage-hl:#B9DCC7;
    --berry:#B23A5B; --berry-l:#FBE8EC; --berry-hl:#F0B9C7;
    --gold:#AE8342; --gold-l:#F5EBD8; --gold-hl:#EAD3A0;
    --amber:#C97A3D; --amber-l:#F5E3D3; --amber-hl:#EEC392;
    --teal:#5B8C87; --teal-l:#E3EEEC; --teal-hl:#B9D9D3;
    --txt:#463A40; --mut:#8A757E; --mut2:#A8949C; --deep:#5C4952;
    --btnbg:#5C4952; --btntext:#FAF3F1;
    --shadow:0 6px 20px rgba(168,85,120,.07); --shadow-sm:0 4px 14px rgba(168,85,120,.05);
    --disp:"Cormorant Garamond",Georgia,"Iowan Old Style",serif;
    --ui:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --paper:var(--bg); --ink:var(--txt); --line:var(--line);
    --b2:var(--sage); --b2bg:var(--sage-l);
    --b2p:var(--lav); --b2pbg:var(--lav-l);
    --c1:var(--gold); --c1bg:var(--gold-l);
  }
  body.dark{
    --bg:#221A28; --wash:#2C2233; --card:#2A2130;
    --line:#3D3140; --line2:#4A3B4D; --tint:#332838;
    --rose:#E3A0BD; --rose-l:#4A2F3B; --rose-s:#D8A8BF; --rose-hl:#6B3F52;
    --lav:#C3AEE0; --lav-l:#3A3049; --lav-hl:#55447A;
    --sage:#9BD1B3; --sage-l:#2A3B32; --sage-hl:#3E5F4C;
    --berry:#E9A0B0; --berry-l:#402831; --berry-hl:#63394A;
    --gold:#E0BD86; --gold-l:#3D3327; --gold-hl:#5C4A2F;
    --amber:#E6B180; --amber-l:#3D2F22; --amber-hl:#5C4630;
    --teal:#C2ABDD; --teal-l:#362C46; --teal-hl:#4F3F66;
    --txt:#EDE4EA; --mut:#B8A8BC; --mut2:#8F7F93; --deep:#F3E9F5;
    --btnbg:#E3A0BD; --btntext:#221A28;
    --shadow:0 6px 20px rgba(0,0,0,.28); --shadow-sm:0 4px 14px rgba(0,0,0,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;
    background:var(--bg);
    background-image:radial-gradient(120% 60% at 50% -10%, var(--wash) 0%, rgba(247,234,234,0) 62%);
    background-repeat:no-repeat; background-attachment:fixed;
    color:var(--txt); font-family:var(--ui); font-size:16px; line-height:1.55;
    -webkit-text-size-adjust:100%; zoom:1.5}
  .wrap{max-width:680px;margin:0 auto;padding:18px 16px 70px}
  h1,h2,h3{font-family:var(--disp);margin:0}
  header{border-bottom:1.5px solid var(--line2);padding-bottom:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
  header h1{font-weight:600;font-size:27px;line-height:1.15;color:var(--deep)}
  header .sub{font-family:var(--ui);font-size:11px;color:var(--rose-s);letter-spacing:.05em;text-transform:uppercase;font-weight:700;margin-top:4px}
  .lockbadge{font-family:var(--ui);font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;white-space:nowrap;flex-shrink:0}
  .locked{background:var(--berry-l);color:var(--berry)}
  .unlocked{background:var(--sage-l);color:var(--sage)}

  nav.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1.5px solid var(--line2);padding-bottom:2px}
  nav.tabs button{flex:1;font-family:var(--ui);font-weight:700;font-size:13px;padding:10px 4px;
    background:transparent;color:var(--txt);opacity:.5;border:none;border-bottom:3px solid transparent;cursor:pointer}
  nav.tabs button.on{opacity:1;border-bottom-color:var(--rose);color:var(--rose)}

  .view{display:none}
  .view.on{display:block}

  .card{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
  .cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .topiccard{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:14px;cursor:pointer;transition:border-color .15s;box-shadow:var(--shadow-sm)}
  .topiccard:hover{border-color:var(--rose-s)}
  .topiccard .tname{font-family:var(--disp);font-weight:600;font-size:18px;margin-bottom:6px;color:var(--deep)}
  .topiccard .tgenre{font-family:var(--ui);font-size:11px;color:var(--rose);text-transform:uppercase;letter-spacing:.03em;font-weight:700;margin-bottom:8px}
  .dots{display:flex;gap:5px}
  .dot{width:9px;height:9px;border-radius:50%}

  .sectiontitle{font-family:var(--ui);font-size:12px;color:var(--rose);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin:20px 0 10px}
  .sectiontitle:first-child{margin-top:0}

  .btn{font-family:var(--ui);font-weight:700;font-size:14px;padding:12px 18px;border-radius:12px;border:none;cursor:pointer}
  .btn-primary{background:var(--btnbg);color:var(--btntext)}
  .btn-ghost{background:transparent;border:1.5px solid var(--line2);color:var(--deep)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-block{width:100%;text-align:center}

  .levelpill{display:inline-flex;align-items:center;gap:6px;font-family:var(--ui);font-weight:700;font-size:13px;padding:5px 12px;border-radius:20px;border:1.5px solid transparent;cursor:pointer}
  .lvl-B2{background:var(--sage-l);color:var(--sage);border-color:var(--sage)}
  .lvl-B2plus{background:var(--lav-l);color:var(--lav);border-color:var(--lav)}
  .lvl-C1{background:var(--gold-l);color:var(--gold);border-color:var(--gold)}
  .levelrow{display:flex;gap:8px;margin-bottom:14px}
  .levelpill.off{opacity:.45}

  .backbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
  .backbar button{background:none;border:none;font-family:var(--ui);font-weight:700;font-size:14px;color:var(--rose);cursor:pointer;padding:6px 0}

  .audiobar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line2);
    border-radius:14px;padding:10px 14px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
  .audiobtn{font-family:var(--ui);font-weight:700;font-size:14px;color:var(--deep);background:var(--tint);
    border:1.5px solid var(--line2);border-radius:20px;padding:8px 16px;cursor:pointer}
  .audiobtn.playing{background:var(--rose);color:#fff;border-color:var(--rose)}
  .loopToggle{display:flex;align-items:center;gap:6px;font-family:var(--ui);font-size:13px;color:var(--mut);cursor:pointer;user-select:none}
  .loopToggle input{accent-color:var(--rose);width:16px;height:16px;cursor:pointer}
  .themeToggleBtn{font-family:var(--ui);font-weight:700;font-size:12.5px;color:var(--deep);background:var(--card);
    border:1.5px solid var(--line2);border-radius:20px;padding:7px 14px;cursor:pointer;box-shadow:var(--shadow-sm)}

  .essaytitle{font-family:var(--disp);font-size:26px;font-weight:600;margin-bottom:6px;color:var(--deep)}
  .focustag{display:inline-block;font-family:var(--ui);font-size:12px;background:var(--lav-l);color:var(--lav);padding:4px 12px;border-radius:12px;margin-bottom:14px}
  .essaybody p{margin:0 0 16px 0}
  .wcnote{font-family:var(--ui);font-size:12px;color:var(--mut2);text-align:right;margin-top:8px}

  .quizbox{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
  .qprogress{font-family:var(--ui);font-size:12px;color:var(--rose);font-weight:700;margin-bottom:10px;text-transform:uppercase;letter-spacing:.03em}
  .qtext{font-family:var(--disp);font-size:20px;font-weight:600;margin-bottom:16px;line-height:1.4;color:var(--deep)}
  .qopt{display:block;width:100%;text-align:left;background:var(--tint);border:1.5px solid var(--line2);border-radius:12px;
    padding:12px 14px;margin-bottom:8px;font-family:var(--ui);font-size:15px;cursor:pointer;color:var(--txt)}
  .qopt:hover{border-color:var(--rose-s)}
  .qopt.correct{background:var(--sage-l);border-color:var(--sage);color:var(--sage);font-weight:700}
  .qopt.wrong{background:var(--berry-l);border-color:var(--berry);color:var(--berry);font-weight:700}
  .qopt:disabled{cursor:default}
  .qscore{font-size:13px;color:var(--mut);margin-top:10px}

  .miniquiz{margin-top:16px;padding-top:16px;border-top:1px solid var(--line2)}

  .lockscreen{background:var(--card);border:1.5px dashed var(--berry);border-radius:18px;padding:26px;text-align:center;color:var(--mut)}
  .lockscreen .emoji{font-size:34px;margin-bottom:8px}
  .lockscreen h3{font-family:var(--disp);font-size:20px;margin-bottom:6px;color:var(--deep)}
  .lockscreen p{font-family:var(--ui);font-size:14px;color:var(--mut);margin:0 0 14px}
  .progressbar{background:var(--line2);border-radius:8px;height:8px;overflow:hidden;margin:10px 0}
  .progressbar-fill{background:var(--sage);height:100%;transition:width .3s}

  .chapteritem{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line2);
    border-radius:12px;padding:12px 14px;margin-bottom:8px;font-family:var(--ui);font-size:14px}
  .chapteritem .cdate{font-size:11px;color:var(--mut2)}
  input[type=text]{font-family:var(--ui);font-size:15px;padding:11px 14px;border:1.5px solid var(--line2);border-radius:12px;width:100%;margin-bottom:10px;background:var(--tint)}

  .streakcard{display:flex;gap:14px;margin-bottom:16px}
  .streakcard .stat{flex:1;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:14px;text-align:center;box-shadow:var(--shadow-sm)}
  .streakcard .stat .n{font-family:var(--disp);font-size:28px;font-weight:600;color:var(--deep)}
  .streakcard .stat .l{font-family:var(--ui);font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;margin-top:2px}

  /* ===== home: ring / gate / cta (matches New Level 4 trainer) ===== */
  .ring{display:flex;align-items:center;gap:16px;background:var(--card);
    border:1px solid var(--line2);border-radius:20px;padding:16px;margin-bottom:14px;
    box-shadow:var(--shadow)}
  .ring svg{flex:0 0 68px}
  .ring .rt{font-family:var(--disp);font-size:30px;font-weight:600;line-height:1;color:var(--deep)}
  .ring .rt span{color:var(--mut2);font-size:19px}
  .ring .rl{font-family:var(--ui);font-size:11.5px;color:var(--mut);margin-top:4px;line-height:1.35}
  .ring .mini{display:flex;gap:14px;margin-top:9px;font-family:var(--ui);font-size:11.5px;color:var(--mut);flex-wrap:wrap}
  .ring .mini b{color:var(--deep)}

  .gate{background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:18px;margin-bottom:16px;
    box-shadow:var(--shadow)}
  .gate-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .gate-top .gt{font-family:var(--disp);font-size:19px;font-weight:600;color:var(--deep)}
  .gate-top .gt b{font-family:var(--disp)}
  .gate .gm{font-family:var(--ui);font-size:13.5px;color:var(--mut);margin-top:10px;line-height:1.55}

  .cta{display:block;width:100%;background:var(--btnbg);color:var(--btntext);border:none;border-radius:18px;
    padding:18px;text-align:center;cursor:pointer;margin-bottom:20px;font-family:var(--ui)}
  .cta .ctamain{font-weight:800;font-size:17px}
  .cta .ctasub{font-size:12.5px;opacity:.75;margin-top:5px}
  .cta.done{background:var(--sage)}

  .whylevel{font-family:var(--ui);font-size:12px;color:var(--txt);background:var(--gold-l);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:14px}

  /* ===== essay rich markup (matches PDF study sheets) ===== */
  .essaybody .focus{display:inline-block;font-family:var(--ui);font-size:12px;background:var(--lav-l);color:var(--lav);padding:4px 12px;border-radius:12px;margin-bottom:14px}
  .essaybody .whylevel{margin-bottom:16px}
  .essaybody .whylevel b{display:block;color:var(--gold);font-family:var(--ui);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
  .essaybody .whylevel ul{margin:0;padding-left:16px}
  .essaybody p{font-family:var(--disp);font-size:19px;line-height:1.7;color:var(--txt);margin:0 0 16px 0}
  .voc{color:var(--lav);font-weight:700}
  .bonus{color:var(--rose);font-weight:700}
  .fn{font-family:var(--ui);font-size:12px;color:var(--rose);font-weight:700;vertical-align:super}
  .g-pass{background:var(--berry-hl);border-bottom:3px solid var(--berry);border-radius:3px;padding:0 2px;cursor:help}
  .g-ppc{background:var(--gold-hl);border-bottom:3px solid var(--gold);border-radius:3px;padding:0 2px;cursor:help}
  .g-part{background:var(--sage-hl);border-bottom:3px solid var(--sage);border-radius:3px;padding:0 2px;cursor:help}
  .g-partp{background:var(--lav-hl);border-bottom:3px solid var(--lav);border-radius:3px;padding:0 2px;cursor:help}
  .g-ger{background:var(--rose-hl);border-bottom:3px solid var(--rose-s);border-radius:3px;padding:0 2px;cursor:help}
  .g-inv{background:var(--amber-hl);border-bottom:3px solid var(--amber);border-radius:3px;padding:0 2px;cursor:help}
  .g-link{background:var(--teal-hl);border-bottom:3px solid var(--teal);border-radius:3px;padding:0 2px;cursor:help}
  .voc,.bonus{cursor:help}
  .essaybody .footnotes{font-family:var(--ui);font-size:12px;color:var(--rose);margin-top:14px;border-top:1px solid var(--line2);padding-top:10px;line-height:1.6}
  .essaybody .struct-legend,.essaybody .glegend{font-family:var(--ui);font-size:11px;color:var(--mut);margin-top:12px;border-top:1px solid var(--line2);padding-top:9px}
  .essaybody .ghead{font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:10px;color:var(--mut2);margin-bottom:6px}
  .essaybody .gitem{display:inline-block;margin-right:12px;margin-bottom:4px}
  .essaybody .gdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
  .essaybody .refs{font-family:var(--ui);font-size:11.5px;color:var(--mut);margin-top:10px}
  .essaybody .refs .refhead{font-weight:700;color:var(--mut2);margin-bottom:3px;text-transform:uppercase;letter-spacing:1px;font-size:10.5px}
  .essaybody .wc{font-family:var(--ui);font-size:11px;color:var(--mut2);text-align:right;margin-top:6px}
  .essaybody .struct-tag{display:inline-block;font-family:var(--ui);font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:9px;margin-bottom:6px;color:#fff}
  .essaybody .st-1{background:var(--rose)}
  .essaybody .st-2{background:var(--sage)}
  .essaybody .st-3{background:var(--gold)}
  .essaybody .st-4{background:var(--lav)}
  .essaybody .st-5{background:var(--teal)}
  .essaybody .block{margin-bottom:14px}
  .essaybody .email-meta{font-family:var(--ui);font-size:12px;color:var(--mut);margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Oshima Study Hub</h1>
      <div class="sub">Writing Academic English · progress tracker</div>
    </div>
    <div class="lockbadge locked" id="lockBadge">🔒 locked</div>
  </header>
  <div style="display:flex;justify-content:flex-end;margin:-10px 0 8px">
    <button id="themeToggle" class="themeToggleBtn">🌙 Dark mode</button>
  </div>

  <nav class="tabs">
    <button data-view="home" class="on">Home</button>
    <button data-view="library">Essays · 36</button>
    <button data-view="quiz">Quiz</button>
    <button data-view="chapters">Chapters</button>
  </nav>

  <!-- HOME -->
  <div class="view on" id="view-home">
    <div class="ring">
      <svg viewBox="0 0 68 68" width="68" height="68">
        <circle cx="34" cy="34" r="29" fill="none" stroke="var(--line2)" stroke-width="7"/>
        <circle id="ringProgress" cx="34" cy="34" r="29" fill="none" stroke="var(--rose-s)" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="182.2" stroke-dashoffset="182.2" transform="rotate(-90 34 34)"/>
      </svg>
      <div>
        <div class="rt" id="ringText">0 <span>/ 36</span></div>
        <div class="rl">essays studied</div>
        <div class="mini">
          <span>quiz answers <b id="miniAnswers">0</b></span>
          <span>best accuracy <b id="miniAccuracy">—</b></span>
          <span>chapters <b id="miniChapters">0</b></span>
        </div>
      </div>
    </div>

    <div class="gate">
      <div class="gate-top">
        <span class="gt" id="gateTitle"><b>0</b> of 50 questions today</span>
        <span class="lockbadge locked" id="gateBadge">🔒 locked</span>
      </div>
      <div class="progressbar"><div class="progressbar-fill" id="gateBar" style="width:0%"></div></div>
      <div class="gm" id="gateMsg"></div>
    </div>

    <button class="cta" id="ctaBtn" onclick="switchView('quiz')">
      <div class="ctamain" id="ctaMain">Start today's quiz →</div>
      <div class="ctasub" id="ctaSub"></div>
    </button>

    <div class="sectiontitle">Recently learned</div>
    <div id="homeChapterList"></div>
  </div>

  <!-- LIBRARY -->
  <div class="view" id="view-library">
    <div class="sectiontitle">🌪 Natural disasters — informative essays</div>
    <div class="cardgrid" id="libDisasters"></div>
    <div class="sectiontitle">✉️ Genres — email, blog, letter</div>
    <div class="cardgrid" id="libGenres"></div>
  </div>

  <!-- ESSAY DETAIL (hidden container, shown via JS) -->
  <div class="view" id="view-essay">
    <div class="backbar"><button id="backToLib">← All essays</button></div>
    <div class="levelrow" id="essayLevelRow"></div>
    <div class="audiobar">
      <button class="audiobtn" id="audioPlayBtn">▶ Read aloud</button>
      <label class="loopToggle">
        <input type="checkbox" id="audioLoopToggle">
        <span>Loop</span>
      </label>
    </div>
    <div class="card">
      <div class="essaytitle" id="essayTitle"></div>
      <div class="essaybody" id="essayBody"></div>
    </div>
    <div class="card miniquiz" id="miniQuizCard"></div>
  </div>

  <!-- QUIZ -->
  <div class="view" id="view-quiz">
    <div id="quizArea"></div>
  </div>

  <!-- CHAPTERS -->
  <div class="view" id="view-chapters">
    <div id="chaptersArea"></div>
  </div>

</div>

<script>
const ESSAYS = [{"topic": "Wildfires", "genre": "disaster", "level": "B2", "title": "Wildfires: A Growing Global Threat", "focus": "How to prepare (safety measures)", "html": "<div class=\"focus\"><b>Focus:</b> How to prepare (safety measures)</div>\n<p><span class=\"voc\">Wildfires</span> are large, uncontrolled fires that spread <span class=\"voc\">rapidly</span> through forests, grasslands, and rural areas. They <span class=\"g-pass\">are usually caused by</span> lightning, but human activity often starts them too, whether <span class=\"voc\">deliberately</span> or <span class=\"voc\">accidentally</span>. In recent decades, the number of wildfires <span class=\"g-ppc\">has been increasing</span> dramatically as <span class=\"voc\">a result of</span> climate change and rising temperatures.</p>\n<p>Once a fire starts, <span class=\"voc\">favourable</span> conditions such as dry vegetation and strong wind allow it to spread with alarming speed. <span class=\"g-part\">Having spread across thousands of hectares</span>, a single wildfire can destroy entire <span class=\"voc\">habitats</span> within hours. Local <span class=\"voc\">authorities</span> are responsible for organising the response: <span class=\"voc\">identifying</span> the areas at risk, issuing public warnings, and coordinating rescuers on the ground.</p>\n<p><span class=\"g-ger\">Igniting dry grassland</span> takes only a spark, but <span class=\"g-ger\">extinguishing a wildfire</span> can take days or even weeks. Firefighters <span class=\"g-ppc\">have been developing</span> new strategies to control these fires, including building firebreaks and using aircraft to drop water directly onto the flames. Nevertheless, some fires <span class=\"bonus\">remain beyond human control<span class=\"fn\">¹</span></span>, especially in remote or mountainous regions.</p>\n<p>Communities living in high-risk zones <span class=\"g-pass\">are now required</span> to prepare <span class=\"voc\">emergency</span> kits and evacuation plans. <span class=\"voc\">Regrettably</span>, the <span class=\"voc\">impact</span> of wildfires on wildlife is often overlooked — for example, the 2020 Australian bushfires alone affected an estimated three billion animals. Thousands of species lose their natural habitat every year, and some <span class=\"voc\">endangered species</span> may never recover.</p>\n<p>Despite <span class=\"voc\">ongoing</span> efforts to <span class=\"voc\">reduce</span> the risk, experts agree that the problem <span class=\"bonus\">remains unresolved<span class=\"fn\">²</span></span> on a global scale. <span class=\"g-ger\">Preventing wildfires</span> requires <span class=\"voc\">cooperation</span> between governments, scientists, and local communities alike.</p>\n<div class=\"footnotes\">1 — остаются вне контроля человека     2 — остаётся нерешённой</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Present Simple Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>How wildfires can grow deadly overnight</i>. Available at: nationalgeographic.com/environment/article/wildfires</div>\n<div class=\"wc\">≈ 255 words</div>", "wc": "≈ 255 words"}, {"topic": "Wildfires", "genre": "disaster", "level": "B2+", "title": "Wildfires: A Growing Global Threat", "focus": "How to prepare (safety measures)", "html": "<div class=\"focus\"><b>Focus:</b> How to prepare (safety measures)</div>\n<div class=\"whylevel\"><b>What makes this B2+, not B2</b>\n<ul>\n<li>Formal connectors replace simple ones: <i>nevertheless, consequently, therefore</i> instead of repeating <i>but/so</i></li>\n<li>More precise word choice: <i>capable of destroying</i> instead of <i>can destroy</i>; <i>rising</i> instead of repeating <i>increasing</i></li>\n<li>Passive used for objectivity: <i>is attributed to, is believed to have affected</i> — distances the writer from the claim, typical of academic style</li>\n<li>Sentences are longer, with embedded clauses joined by dashes and semicolons</li>\n</ul>\n</div>\n<p>Wildfires are extensive, uncontrolled fires that spread across forests, grasslands, and rural areas at considerable speed. Although lightning remains the primary natural cause, human activity — whether deliberate or accidental — <span class=\"g-pass\">is responsible for</span> starting a significant proportion of these fires. Over the past few decades, the frequency of wildfires <span class=\"g-ppc\">has been rising</span> steadily, a trend that is largely attributed to climate change and increasingly high temperatures.</p>\n<p>Once ignited, a fire can spread with alarming speed under favourable conditions such as dry vegetation and strong winds. <span class=\"g-part\">Having spread across thousands of hectares within hours</span>, a single wildfire is capable of destroying entire habitats before it can be brought under control. Local authorities therefore play a crucial role in coordinating the response, from <span class=\"g-ger\">identifying high-risk areas</span> to issuing timely public warnings.</p>\n<p>While igniting dry grassland requires only a spark, extinguishing a large-scale wildfire may take days, or even weeks, depending on its scale. In response, firefighters <span class=\"g-ppc\">have been developing</span> increasingly sophisticated strategies, including the construction of firebreaks and the use of aircraft to release water directly onto the flames. Nevertheless, certain fires <span class=\"bonus\">remain largely beyond human control<span class=\"fn\">¹</span></span>, particularly in remote or mountainous terrain.</p>\n<p>Communities located in high-risk zones <span class=\"g-pass\">are now required</span> to prepare emergency kits and detailed evacuation plans. Regrettably, the ecological impact of wildfires is frequently underestimated; the 2020 Australian bushfires, for example, <span class=\"g-pass\">are believed to have affected</span> roughly three billion animals. Consequently, thousands of species lose their natural habitat annually, and some endangered species may never fully recover.</p>\n<p>Despite ongoing efforts to reduce this risk, the underlying problem <span class=\"bonus\">remains largely unresolved<span class=\"fn\">²</span></span> on a global scale, underscoring the need for closer cooperation between governments, scientists, and local communities.</p>\n<div class=\"footnotes\">1 — по-прежнему в основном вне контроля человека     2 — по большей части остаётся нерешённой</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Present Simple Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>How wildfires can grow deadly overnight</i>. Available at: nationalgeographic.com/environment/article/wildfires</div>\n<div class=\"wc\">≈ 260 words</div>", "wc": "≈ 260 words"}, {"topic": "Wildfires", "genre": "disaster", "level": "C1", "title": "Wildfires: A Growing Global Threat", "focus": "How to prepare (safety measures)", "html": "<div class=\"focus\"><b>Focus:</b> How to prepare (safety measures)</div>\n<div class=\"whylevel\"><b>What makes this C1, not B2+</b>\n<ul>\n<li><span class=\"g-inv\">Inversion</span> for emphasis: <i>Rarely has the sheer scale of this threat been as apparent...</i> — fronting a negative adverb and inverting subject/auxiliary is a distinctly C1 structure</li>\n<li>Nominalisation: abstract nouns replace verb phrases — <i>the sheer scale of this threat, mitigation efforts</i> — makes the tone more formal and detached</li>\n<li>Hedged claims: <i>are estimated to have affected, is capable of obliterating</i> — signals academic caution rather than blunt assertion</li>\n<li>Wider register: <i>conflagrations, notwithstanding, obliged, exact (verb)</i> — precise, less common vocabulary that native C1 texts favour over everyday synonyms</li>\n<li>Dashes and semicolons structure long sentences instead of splitting them into short ones</li>\n</ul>\n</div>\n<p>Wildfires — extensive, uncontrolled conflagrations that sweep through forests, grasslands, and rural landscapes — pose one of the most pressing environmental challenges of our time. While lightning remains a significant natural trigger, a substantial proportion of these fires can be attributed to human activity, be it deliberate or accidental. <span class=\"g-inv\">Rarely has the sheer scale of this threat been as apparent</span> as in recent decades, during which the frequency of wildfires <span class=\"g-ppc\">has been rising</span> markedly, largely as a consequence of climate change and unprecedented temperature increases.</p>\n<p>Once ignited, a fire may spread with alarming rapidity, its progress fuelled by favourable conditions such as parched vegetation and strong winds. <span class=\"g-part\">Having engulfed thousands of hectares within a matter of hours</span>, a single wildfire is capable of obliterating entire ecosystems long before containment becomes possible. It therefore falls to local authorities to coordinate an effective response — <span class=\"g-ger\">identifying vulnerable areas, issuing timely warnings, and mobilising rescue teams</span>.</p>\n<p>Although igniting dry grassland demands little more than a spark, extinguishing a large-scale blaze can take weeks, and even then success is far from guaranteed. Increasingly sophisticated firefighting strategies have been developed in response, ranging from constructed firebreaks to aerial water deployment. Nevertheless, certain fires <span class=\"bonus\">remain, in effect, beyond the reach of human intervention<span class=\"fn\">¹</span></span>, particularly across remote or mountainous terrain.</p>\n<p>Residents of high-risk zones <span class=\"g-pass\">are now obliged</span> to maintain emergency provisions and comprehensive evacuation plans. What is often overlooked, regrettably, is the ecological toll such disasters exact: the 2020 Australian bushfires alone <span class=\"g-pass\">are estimated to have affected</span> some three billion animals, leaving several endangered species unlikely ever to recover.</p>\n<p>Notwithstanding ongoing mitigation efforts, the problem <span class=\"bonus\">remains, by most accounts, unresolved<span class=\"fn\">²</span></span> on a global scale — a reality that underscores the urgency of sustained international cooperation.</p>\n<div class=\"footnotes\">1 — фактически остаются вне досягаемости человеческого вмешательства     2 — по большинству оценок остаётся нерешённой</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#e08b3f\"></span>Inversion (C1 marker)</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Present Simple Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>How wildfires can grow deadly overnight</i>. Available at: nationalgeographic.com/environment/article/wildfires</div>\n<div class=\"wc\">≈ 280 words</div>", "wc": "≈ 280 words"}, {"topic": "Avalanches", "genre": "disaster", "level": "B2", "title": "Avalanches: When Snow Turns Deadly", "focus": "Causes and mechanism", "html": "<div class=\"focus\"><b>Focus:</b> Causes and mechanism</div>\n<p>An <span class=\"voc\">avalanche</span> is a rapid flow of snow down a mountainside, often triggered by a combination of gravity, weather, and human activity. Most avalanches occur in mountainous regions after heavy snowfall, when layers of snow become unstable and unable to support their own weight.</p>\n<p>Skiers, hikers, and even loud noises can disturb the snowpack enough to start a slide. <span class=\"g-partp\">Having been weakened by warm temperatures or rain</span>, a snow layer can collapse within seconds, sending tonnes of snow, ice, and rock down the slope at speeds of over 100 kilometres per hour.</p>\n<p>Local <span class=\"voc\">authorities</span> closely monitor mountain regions during winter, <span class=\"voc\">identifying</span> areas at risk and issuing public warnings when conditions become dangerous. <span class=\"voc\">Reasonable</span> precautions, such as <span class=\"g-ger\">avoiding steep slopes after fresh snowfall</span>, can significantly reduce the risk to travellers and residents.</p>\n<p>Rescuers face an extremely difficult task once an avalanche has occurred. Every minute counts: a person buried under the snow has only a limited chance of survival, and rescue teams must <span class=\"voc\">react</span> quickly, <span class=\"g-ger\">using trained dogs and electronic devices</span> to locate victims.</p>\n<p><span class=\"bonus\">Playing a crucial role<span class=\"fn\">¹</span></span> in avalanche safety is education. Mountain communities <span class=\"g-ppc\">have been teaching</span> visitors how to recognise warning signs, carry emergency kits, and behave responsibly in high-risk areas.</p>\n<p>Although scientists have improved their ability to predict avalanches, nature <span class=\"voc\">nevertheless</span> remains unpredictable. The threat, unfortunately, is unlikely to disappear completely, especially as more people are drawn to mountain sports every year.</p>\n<div class=\"footnotes\">1 — играющий решающую роль</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#9b59b6\"></span>Perfect Participle Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>Avalanches, facts and information</i>. Available at: nationalgeographic.com/environment/article/avalanches</div>\n<div class=\"wc\">≈ 240 words</div>", "wc": "≈ 240 words"}, {"topic": "Avalanches", "genre": "disaster", "level": "B2+", "title": "Avalanches: When Snow Turns Deadly", "focus": "Causes and mechanism", "html": "<div class=\"focus\"><b>Focus:</b> Causes and mechanism</div>\n<div class=\"whylevel\"><b>What makes this B2+, not B2</b>\n<ul>\n<li>Intensifiers and precision adverbs added: <i>considerably weakened, significantly reduce</i> instead of plain adjectives</li>\n<li>A cleft sentence for emphasis: <i>It is education that plays...</i> instead of a simple subject-verb start</li>\n<li>Longer noun phrases with embedded modifiers: <i>a level of risk faced by travellers and residents alike</i></li>\n<li>More formal linking: <i>meaning that, particularly as</i> instead of <i>and, especially as</i></li>\n</ul>\n</div>\n<p>An avalanche is a rapid, often violent flow of snow down a mountainside, typically triggered by a combination of gravity, weather conditions, and human activity. Most avalanches occur in mountainous regions following heavy snowfall, when successive layers of snow become unstable and are no longer able to support their own weight.</p>\n<p>Skiers, hikers, and even loud noises can disturb the snowpack sufficiently to trigger a slide. <span class=\"g-partp\">Having been considerably weakened by warm temperatures or rainfall</span>, a snow layer may collapse within seconds, sending tonnes of snow, ice, and rock down the slope at speeds exceeding 100 kilometres per hour.</p>\n<p>Local authorities monitor mountain regions closely throughout the winter season, identifying areas at particular risk and issuing public warnings whenever conditions become hazardous. Reasonable precautions — such as <span class=\"g-ger\">avoiding steep slopes shortly after fresh snowfall</span> — can significantly reduce the level of risk faced by travellers and residents alike.</p>\n<p>Rescuers are confronted with an extremely challenging task once an avalanche has occurred. Every minute is critical: a person buried beneath the snow has only a limited chance of survival, meaning that rescue teams must react without delay, <span class=\"g-ger\">deploying trained dogs and electronic devices</span> in order to locate victims as quickly as possible.</p>\n<p>It is education that <span class=\"bonus\">plays an increasingly crucial role<span class=\"fn\">¹</span></span> in avalanche safety. Mountain communities <span class=\"g-ppc\">have been teaching</span> visitors how to recognise warning signs, carry appropriate emergency equipment, and behave responsibly within high-risk areas.</p>\n<p>Although scientists have considerably improved their ability to predict avalanches, nature nevertheless <span class=\"bonus\">remains, to a significant extent, unpredictable<span class=\"fn\">²</span></span>. Regrettably, this threat is unlikely to disappear altogether, particularly as growing numbers of people are drawn to mountain sports each year.</p>\n<div class=\"footnotes\">1 — играет всё более важную роль     2 — остаётся, в значительной степени, непредсказуемой</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#9b59b6\"></span>Perfect Participle Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>Avalanches, facts and information</i>. Available at: nationalgeographic.com/environment/article/avalanches</div>\n<div class=\"wc\">≈ 260 words</div>", "wc": "≈ 260 words"}, {"topic": "Avalanches", "genre": "disaster", "level": "C1", "title": "Avalanches: When Snow Turns Deadly", "focus": "Causes and mechanism", "html": "<div class=\"focus\"><b>Focus:</b> Causes and mechanism</div>\n<div class=\"whylevel\"><b>What makes this C1, not B2+</b>\n<ul>\n<li><span class=\"g-inv\">Inversion</span>: <i>Rarely is the danger posed by avalanches fully appreciated...</i> — inverted structure for rhetorical emphasis</li>\n<li>Formal verb choice: <i>constitutes, precipitated, propelling</i> instead of everyday <i>is, triggered, sending</i></li>\n<li>Semicolons joining closely related independent clauses instead of separate sentences</li>\n<li>Absolute/participial precision: <i>necessitating an immediate response in which...</i> — compresses two ideas into one dense clause</li>\n</ul>\n</div>\n<p>An avalanche constitutes a rapid, often catastrophic mass of snow descending a mountainside, typically precipitated by a combination of gravitational force, weather conditions, and human interference. Most avalanches occur in mountainous terrain in the aftermath of heavy snowfall, when successive layers of snow become unstable and can no longer bear their own weight.</p>\n<p>Even skiers, hikers, or loud noises may disturb the snowpack sufficiently to precipitate a slide. <span class=\"g-partp\">Having been substantially weakened by rising temperatures or rainfall</span>, a snow layer can give way within seconds, propelling tonnes of snow, ice, and rock down the slope at speeds in excess of 100 kilometres per hour.</p>\n<p><span class=\"g-inv\">Rarely is the danger posed by avalanches fully appreciated</span> until conditions deteriorate rapidly. Local authorities therefore monitor mountain regions vigilantly throughout the winter, identifying zones of particular vulnerability and issuing timely public warnings whenever conditions become hazardous. Reasonable precautions — <span class=\"g-ger\">avoiding steep slopes shortly after fresh snowfall</span>, for instance — can substantially mitigate the risk faced by travellers and residents alike.</p>\n<p>Rescuers face an exceptionally demanding task once an avalanche has occurred. Time is of the essence: a person buried beneath the snow has only a limited window of survival, necessitating an immediate response in which trained dogs and electronic devices <span class=\"g-pass\">are deployed</span> to locate victims with maximum efficiency.</p>\n<p>It is education, above all, that <span class=\"bonus\">has been playing an increasingly indispensable role<span class=\"fn\">¹</span></span> in avalanche safety; mountain communities <span class=\"g-ppc\">have been instructing</span> visitors in <span class=\"g-ger\">recognising warning signs, carrying appropriate equipment, and behaving responsibly</span> within high-risk terrain.</p>\n<p>Notwithstanding considerable advances in predictive science, nature <span class=\"bonus\">remains, to a considerable degree, inherently unpredictable<span class=\"fn\">²</span></span>. This threat, regrettably, shows little sign of abating, particularly as ever-growing numbers of enthusiasts are drawn to mountain sports each year.</p>\n<div class=\"footnotes\">1 — играющей всё более незаменимую роль     2 — остаётся, в значительной степени, по своей природе непредсказуемой</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#e08b3f\"></span>Inversion (C1 marker)</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#9b59b6\"></span>Perfect Participle Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Present Simple Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>Avalanches, facts and information</i>. Available at: nationalgeographic.com/environment/article/avalanches</div>\n<div class=\"wc\">≈ 270 words</div>", "wc": "≈ 270 words"}, {"topic": "Lightning", "genre": "disaster", "level": "B2", "title": "Lightning: Nature's Electric Force", "focus": "Scientific process & surprising facts", "html": "<div class=\"focus\"><b>Focus:</b> Scientific process &amp; surprising facts</div>\n<p><span class=\"voc\">Lightning</span> is a sudden, powerful release of electricity that occurs during a thunderstorm. It happens when electrical charges build up inside a cloud and <span class=\"g-pass\">are released</span>, either within the cloud, between two clouds, or between a cloud and the ground.</p>\n<p>A single lightning bolt can reach temperatures five times hotter than the surface of the sun, and it travels at incredible speed. <span class=\"g-part\">Having struck the ground</span>, a bolt of lightning can start a wildfire, damage buildings, or, <span class=\"voc\">regrettably</span>, injure people caught outdoors.</p>\n<p>Public safety authorities strongly advise people to avoid open fields, tall trees, and metal objects during a storm, since lightning is more <span class=\"voc\">likely</span> to strike the highest point in an area. <span class=\"g-ger\">Sheltering indoors</span> remains the most <span class=\"voc\">reasonable</span> way to reduce the risk of injury.</p>\n<p>Scientists <span class=\"g-ppc\">have been studying</span> lightning for centuries, yet many aspects of it remain <span class=\"bonus\">poorly understood<span class=\"fn\">¹</span></span>. Modern technology, however, now allows researchers to track storms in real time and issue early warnings to the public.</p>\n<p>Interestingly, lightning also plays a positive role in nature. It helps produce nitrogen compounds that fertilise <span class=\"voc\">soil</span>, supporting plant growth in forests and grasslands. <span class=\"voc\">As a result</span>, this dangerous phenomenon is, in some ways, essential to the balance of ecosystems.</p>\n<p>Despite centuries of study, lightning continues to surprise scientists, proving that even the most familiar natural events can still hold mysteries waiting to be solved.</p>\n<div class=\"footnotes\">1 — плохо изученными</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Present Simple Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>Lightning facts and information</i>. Available at: nationalgeographic.com/environment/article/lightning</div>\n<div class=\"wc\">≈ 230 words</div>", "wc": "≈ 230 words"}, {"topic": "Lightning", "genre": "disaster", "level": "B2+", "title": "Lightning: Nature's Electric Force", "focus": "Scientific process & surprising facts", "html": "<div class=\"focus\"><b>Focus:</b> Scientific process &amp; surprising facts</div>\n<div class=\"whylevel\"><b>What makes this B2+, not B2</b>\n<ul>\n<li>Adverbs of degree sharpen claims: <i>considerably more likely, roughly five times</i> instead of plain comparatives</li>\n<li>Formal conjunctions: <i>given that, nevertheless, thereby</i> replace <i>since, yet, and</i></li>\n<li>Reformulated verbs for precision: <i>is capable of starting</i> instead of <i>can start</i></li>\n<li>\"By far\" and \"therefore\" added to strengthen logical connections between ideas</li>\n</ul>\n</div>\n<p>Lightning is a sudden, extremely powerful discharge of electricity that occurs during a thunderstorm. It happens when electrical charges accumulate inside a cloud and <span class=\"g-pass\">are subsequently released</span>, either within the cloud itself, between two separate clouds, or between a cloud and the ground below.</p>\n<p>A single lightning bolt can reach temperatures roughly five times hotter than the surface of the sun, travelling at extraordinary speed. <span class=\"g-part\">Having struck the ground</span>, a bolt of lightning is capable of starting a wildfire, damaging buildings, or, regrettably, injuring anyone caught outdoors.</p>\n<p>Public safety authorities strongly advise avoiding open fields, tall trees, and metal objects during a storm, given that lightning is considerably more likely to strike the highest point within a given area. <span class=\"g-ger\">Sheltering indoors</span> therefore remains by far the most reasonable means of reducing the risk of injury.</p>\n<p>Scientists <span class=\"g-ppc\">have been studying</span> lightning for centuries; nevertheless, numerous aspects of it remain <span class=\"bonus\">poorly understood<span class=\"fn\">¹</span></span>. Modern technology, however, now enables researchers to track storms in real time and issue early warnings to the public well in advance.</p>\n<p>Interestingly, lightning also plays a broadly positive role within nature. It contributes to the production of nitrogen compounds that fertilise soil, thereby supporting plant growth in forests and grasslands. Consequently, this seemingly destructive phenomenon is, in certain respects, essential to maintaining the balance of ecosystems.</p>\n<p>Despite centuries of dedicated research, lightning continues to surprise scientists, demonstrating that even the most familiar natural phenomena can still conceal mysteries yet to be solved.</p>\n<div class=\"footnotes\">1 — плохо изученными</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Present Simple Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>Lightning facts and information</i>. Available at: nationalgeographic.com/environment/article/lightning</div>\n<div class=\"wc\">≈ 245 words</div>", "wc": "≈ 245 words"}, {"topic": "Lightning", "genre": "disaster", "level": "C1", "title": "Lightning: Nature's Electric Force", "focus": "Scientific process & surprising facts", "html": "<div class=\"focus\"><b>Focus:</b> Scientific process &amp; surprising facts</div>\n<div class=\"whylevel\"><b>What makes this C1, not B2+</b>\n<ul>\n<li><span class=\"g-inv\">Inversion</span>: <i>Rarely is the sheer unpredictability of lightning fully appreciated...</i></li>\n<li>Dense pre-modification: <i>the sheer unpredictability of lightning</i>, <i>an electrical discharge generated during a thunderstorm</i></li>\n<li>Formal register verbs: <i>constitutes, attain, fulfils, confound</i> instead of <i>is, reach, plays, surprise</i></li>\n<li>Parenthetical dashes for precise, layered explanation instead of separate sentences</li>\n</ul>\n</div>\n<p>Lightning constitutes a sudden, immensely powerful electrical discharge generated during a thunderstorm, occurring when electrical charges accumulate within a cloud and <span class=\"g-pass\">are subsequently released</span> — whether within the cloud itself, between two adjacent clouds, or between a cloud and the ground below.</p>\n<p>A single bolt can attain temperatures approximately five times hotter than the sun's surface, travelling at extraordinary velocity. <span class=\"g-part\">Having struck the ground</span>, a lightning bolt is capable of igniting a wildfire, inflicting structural damage, or, regrettably, injuring those caught unprotected outdoors.</p>\n<p><span class=\"g-inv\">Rarely is the sheer unpredictability of lightning fully appreciated</span> by the public, despite authorities repeatedly advising against open fields, tall trees, and metal objects during electrical storms — precisely because lightning is considerably more likely to strike the highest point within a given vicinity. <span class=\"g-ger\">Sheltering indoors</span> therefore constitutes, by a considerable margin, the most prudent means of mitigating the risk of injury.</p>\n<p>Scientists <span class=\"g-ppc\">have been investigating</span> lightning for centuries; nevertheless, numerous aspects of the phenomenon remain, even now, <span class=\"bonus\">poorly understood<span class=\"fn\">¹</span></span>. Advances in technology, however, now permit researchers to track storm systems in real time, issuing early warnings well in advance of potential danger.</p>\n<p>Notably, lightning also fulfils a broadly beneficial function within natural ecosystems, contributing to the formation of nitrogen compounds that enrich soil and, in doing so, sustain plant growth across forests and grasslands. This ostensibly destructive phenomenon is, therefore, in certain respects, <span class=\"bonus\">indispensable to ecological equilibrium<span class=\"fn\">²</span></span>.</p>\n<p>Notwithstanding centuries of rigorous inquiry, lightning continues to confound scientists, illustrating that even the most familiar natural phenomena may yet conceal mysteries awaiting discovery.</p>\n<div class=\"footnotes\">1 — даже сейчас остаются плохо изученными     2 — необходим для экологического равновесия</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#e08b3f\"></span>Inversion (C1 marker)</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Present Simple Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>Lightning facts and information</i>. Available at: nationalgeographic.com/environment/article/lightning</div>\n<div class=\"wc\">≈ 245 words</div>", "wc": "≈ 245 words"}, {"topic": "Tsunamis", "genre": "disaster", "level": "B2", "title": "Tsunamis: Waves of Destruction", "focus": "Early-warning systems & international cooperation", "html": "<div class=\"focus\"><b>Focus:</b> Early-warning systems &amp; international cooperation</div>\n<p>A <span class=\"voc\">tsunami</span> is a series of enormous waves usually caused by an earthquake beneath the ocean floor. Unlike ordinary waves, a tsunami can travel across an entire ocean at the speed of a jet plane, remaining almost invisible until it approaches the coast.</p>\n<p>As a tsunami reaches shallow water near the shore, its speed decreases dramatically while its height increases, sometimes reaching over thirty metres. <span class=\"g-part\">Having travelled thousands of kilometres</span>, a tsunami can devastate coastal <span class=\"voc\">settlements</span> within minutes of arrival.</p>\n<p>Coastal authorities rely on early warning systems to <span class=\"voc\">identify</span> the danger and alert the public before the waves arrive. Communities in high-risk areas <span class=\"g-pass\">are taught</span> to react immediately, moving to higher ground rather than <span class=\"g-ger\">waiting to see the wave itself</span>.</p>\n<p>The <span class=\"voc\">impact</span> of a tsunami is often catastrophic: entire towns can be destroyed, and the death toll can rise into the thousands. <span class=\"voc\">Regrettably</span>, the areas most affected are frequently the most <span class=\"voc\">crowded</span> and least prepared, especially in developing regions.</p>\n<p>International <span class=\"voc\">cooperation</span> has <span class=\"bonus\">been playing an increasingly important role<span class=\"fn\">¹</span></span> in tsunami prevention. Countries around the Pacific Ocean now share data continuously, helping to reduce response time and save lives.</p>\n<p><span class=\"voc\">Nevertheless</span>, no warning system can fully prevent the destruction a tsunami causes. Preparedness, education, and rapid evacuation remain the most effective tools available to reduce the loss of life.</p>\n<div class=\"footnotes\">1 — играющее всё более важную роль</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Present Simple Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>Tsunami facts and information</i>. Available at: nationalgeographic.com/environment/article/tsunamis</div>\n<div class=\"wc\">≈ 240 words</div>", "wc": "≈ 240 words"}, {"topic": "Tsunamis", "genre": "disaster", "level": "B2+", "title": "Tsunamis: Waves of Destruction", "focus": "Early-warning systems & international cooperation", "html": "<div class=\"focus\"><b>Focus:</b> Early-warning systems &amp; international cooperation</div>\n<div class=\"whylevel\"><b>What makes this B2+, not B2</b>\n<ul>\n<li>Precision modifiers: <i>exceptionally powerful, dramatically, substantially</i> replace plain adjectives</li>\n<li>\"By a considerable margin\" and \"however sophisticated\" add formal hedging and concession</li>\n<li>\"Making landfall\" and \"in order to\" replace simpler phrasing for a more formal register</li>\n<li>Longer, more layered sentences joining cause and effect within a single clause</li>\n</ul>\n</div>\n<p>A tsunami is a series of exceptionally powerful waves, most commonly caused by an earthquake occurring beneath the ocean floor. Unlike ordinary waves, a tsunami is capable of travelling across an entire ocean at the speed of a jet plane, remaining almost undetectable until it approaches the coastline.</p>\n<p>As a tsunami reaches shallow water near the shore, its speed decreases dramatically while its height increases substantially, occasionally exceeding thirty metres. <span class=\"g-part\">Having travelled thousands of kilometres across open ocean</span>, a tsunami is capable of devastating coastal settlements within minutes of making landfall.</p>\n<p>Coastal authorities therefore rely heavily on early warning systems in order to identify the danger and alert the public before the waves arrive. Communities in high-risk areas <span class=\"g-pass\">are taught</span> to react immediately, moving to higher ground rather than <span class=\"g-ger\">waiting to observe the wave itself</span>.</p>\n<p>The impact of a tsunami is frequently catastrophic: entire towns can be reduced to ruins, and the death toll may rise into the thousands. Regrettably, the areas most severely affected are often those that are simultaneously the most densely populated and the least adequately prepared, particularly across developing regions.</p>\n<p>International cooperation has <span class=\"bonus\">increasingly been playing a vital role<span class=\"fn\">¹</span></span> in tsunami prevention, as countries bordering the Pacific Ocean now share data continuously, thereby helping to reduce response time and, ultimately, save lives.</p>\n<p>Nevertheless, no warning system, however sophisticated, can entirely prevent the destruction a tsunami causes. Preparedness, education, and rapid evacuation therefore remain, by a considerable margin, the most effective tools available for reducing the loss of life.</p>\n<div class=\"footnotes\">1 — всё более играет жизненно важную роль</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Present Simple Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>Tsunami facts and information</i>. Available at: nationalgeographic.com/environment/article/tsunamis</div>\n<div class=\"wc\">≈ 260 words</div>", "wc": "≈ 260 words"}, {"topic": "Tsunamis", "genre": "disaster", "level": "C1", "title": "Tsunamis: Waves of Destruction", "focus": "Early-warning systems & international cooperation", "html": "<div class=\"focus\"><b>Focus:</b> Early-warning systems &amp; international cooperation</div>\n<div class=\"whylevel\"><b>What makes this C1, not B2+</b>\n<ul>\n<li><span class=\"g-inv\">Inversion</span>: <i>Rarely does the sheer destructive potential of a tsunami become apparent...</i></li>\n<li>Verb precision: <i>comprises, precipitated, traversing, diminishes, averting</i> instead of everyday equivalents</li>\n<li>Semicolons connect closely related clauses instead of splitting them into separate sentences</li>\n<li>Absolute phrases add density: <i>with countries bordering the Pacific Ocean now sharing data...</i></li>\n</ul>\n</div>\n<p>A tsunami comprises a series of exceptionally powerful waves, most commonly precipitated by a seismic event occurring beneath the ocean floor. Unlike ordinary waves, a tsunami is capable of traversing an entire ocean at the speed of a jet aircraft, remaining virtually undetectable until it approaches the coastline.</p>\n<p><span class=\"g-inv\">Rarely does the sheer destructive potential of a tsunami become apparent</span> until it reaches shallow water near the shore, at which point its speed diminishes markedly while its height increases substantially, occasionally exceeding thirty metres. <span class=\"g-part\">Having traversed thousands of kilometres across open ocean</span>, a tsunami is capable of devastating coastal settlements within minutes of making landfall.</p>\n<p>Coastal authorities therefore rely heavily upon early-warning systems in order to identify the danger and alert the public before the waves arrive; communities in high-risk areas <span class=\"g-pass\">are instructed</span> to react immediately, retreating to higher ground rather than <span class=\"g-ger\">pausing to observe the wave itself</span>.</p>\n<p>The impact of a tsunami is frequently catastrophic: entire towns can be reduced to rubble, and the death toll may rise into the thousands. Regrettably, the areas most severely affected are often those that are simultaneously the most densely populated and the least adequately prepared, particularly across developing regions.</p>\n<p>International cooperation has <span class=\"bonus\">increasingly been playing an indispensable role<span class=\"fn\">¹</span></span> in tsunami prevention, with countries bordering the Pacific Ocean now sharing data continuously, thereby reducing response time and, ultimately, saving countless lives.</p>\n<p>Notwithstanding these advances, no warning system, however sophisticated, can entirely avert the destruction a tsunami inflicts. Preparedness, education, and rapid evacuation therefore remain, by a considerable margin, the most effective means of mitigating loss of life.</p>\n<div class=\"footnotes\">1 — играет всё более незаменимую роль</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#e08b3f\"></span>Inversion (C1 marker)</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Present Simple Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>Tsunami facts and information</i>. Available at: nationalgeographic.com/environment/article/tsunamis</div>\n<div class=\"wc\">≈ 270 words</div>", "wc": "≈ 270 words"}, {"topic": "Tornadoes", "genre": "disaster", "level": "B2", "title": "Tornadoes: Nature's Most Violent Storms", "focus": "Geographic patterns (where & why)", "html": "<div class=\"focus\"><b>Focus:</b> Geographic patterns (where &amp; why)</div>\n<p>A tornado is a rapidly spinning column of air that stretches from a thunderstorm down to the ground. Tornadoes are considered one of the most violent storms on Earth, with wind speeds that can exceed 300 kilometres per hour.</p>\n<p>Tornadoes form when warm, moist air near the ground meets cold, dry air above it, creating unstable conditions inside a storm cloud. <span class=\"g-partp\">Having been generated by this collision of air masses</span>, a tornado can appear and disappear within minutes, making it extremely difficult to predict.</p>\n<p>Meteorologists <span class=\"g-ppc\">have been developing</span> advanced radar systems to <span class=\"voc\">identify</span> tornadoes as early as possible. Public warning systems then alert residents in the affected area, giving them precious time to <span class=\"voc\">react</span> and seek shelter underground or in a reinforced room.</p>\n<p>The destruction caused by a tornado can be immense: buildings <span class=\"g-pass\">are torn apart</span>, vehicles <span class=\"g-pass\">are thrown through the air</span>, and entire neighbourhoods can be levelled within seconds. <span class=\"voc\">As a result</span>, emergency services must be ready to respond <span class=\"voc\">rapidly</span> once a tornado has passed.</p>\n<p>The United States experiences more tornadoes than any other country, largely due to its unique geography. This region, often called \"Tornado Alley,\" <span class=\"bonus\">remains highly vulnerable<span class=\"fn\">¹</span></span> to these storms every spring.</p>\n<p>Despite decades of research, tornadoes remain one of the least predictable natural disasters, reminding us of how powerful and unpredictable nature can be.</p>\n<div class=\"footnotes\">1 — остаётся крайне уязвимым</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#9b59b6\"></span>Perfect Participle Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Present Simple Passive</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>Tornado facts and information</i>. Available at: nationalgeographic.com/environment/article/tornadoes</div>\n<div class=\"wc\">≈ 235 words</div>", "wc": "≈ 235 words"}, {"topic": "Tornadoes", "genre": "disaster", "level": "B2+", "title": "Tornadoes: Nature's Most Violent Storms", "focus": "Geographic patterns (where & why)", "html": "<div class=\"focus\"><b>Focus:</b> Geographic patterns (where &amp; why)</div>\n<div class=\"whylevel\"><b>What makes this B2+, not B2</b>\n<ul>\n<li>\"Thereby\" and \"rendering\" replace simpler linking words to show logical consequence formally</li>\n<li>Doubled Present Simple Passive: <i>are frequently torn apart... are thrown considerable distances</i> — sustained objective description</li>\n<li>Precision adverbs: <i>considerably more, largely owing to</i> instead of plain comparatives</li>\n<li>A closing participial clause replaces a separate final sentence</li>\n</ul>\n</div>\n<p>A tornado is a rapidly rotating column of air that extends from a thunderstorm down to the ground below. Tornadoes are widely considered among the most violent storms on Earth, with wind speeds capable of exceeding 300 kilometres per hour.</p>\n<p>Tornadoes form when warm, moist air near the ground encounters cold, dry air above it, thereby creating highly unstable conditions within a storm cloud. <span class=\"g-partp\">Having been generated by this collision of air masses</span>, a tornado can appear and disappear within a matter of minutes, rendering it extremely difficult to predict with any accuracy.</p>\n<p>Meteorologists <span class=\"g-ppc\">have been developing</span> increasingly advanced radar systems in order to identify tornadoes as early as possible. Public warning systems subsequently alert residents within the affected area, providing them with precious time to react and seek adequate shelter underground or within a reinforced room.</p>\n<p>The destruction caused by a tornado can be immense: buildings <span class=\"g-pass\">are frequently torn apart</span>, vehicles <span class=\"g-pass\">are thrown considerable distances through the air</span>, and entire neighbourhoods can be levelled within a matter of seconds. Emergency services must therefore be prepared to respond rapidly once a tornado has passed through an area.</p>\n<p>The United States experiences considerably more tornadoes than any other country, largely owing to its distinctive geography. This particular region, often referred to as \"Tornado Alley,\" <span class=\"bonus\">remains highly vulnerable<span class=\"fn\">¹</span></span> to such storms every spring.</p>\n<p>Despite decades of dedicated research, tornadoes remain among the least predictable of all natural disasters, serving as a reminder of just how powerful and unpredictable nature can ultimately be.</p>\n<div class=\"footnotes\">1 — остаётся крайне уязвимым</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#9b59b6\"></span>Perfect Participle Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Present Simple Passive</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>Tornado facts and information</i>. Available at: nationalgeographic.com/environment/article/tornadoes</div>\n<div class=\"wc\">≈ 250 words</div>", "wc": "≈ 250 words"}, {"topic": "Tornadoes", "genre": "disaster", "level": "C1", "title": "Tornadoes: Nature's Most Violent Storms", "focus": "Geographic patterns (where & why)", "html": "<div class=\"focus\"><b>Focus:</b> Geographic patterns (where &amp; why)</div>\n<div class=\"whylevel\"><b>What makes this C1, not B2+</b>\n<ul>\n<li><span class=\"g-inv\">Inversion</span>: <i>Rarely can meteorologists forecast a tornado's precise trajectory...</i></li>\n<li>Elevated verb choice: <i>constitutes, materialise, dissipate, wrought, hurled</i> instead of everyday equivalents</li>\n<li>\"Colloquially termed\" signals awareness of register (formal vs everyday naming)</li>\n<li>Abstract closing: <i>nature's enduring capacity to defy human understanding</i> instead of a simple statement</li>\n</ul>\n</div>\n<p>A tornado constitutes a rapidly rotating column of air extending from a thunderstorm down to the ground below, widely regarded as among the most violent storms occurring on Earth, with wind speeds capable of exceeding 300 kilometres per hour.</p>\n<p>Tornadoes form when warm, moist air near the ground encounters cold, dry air above it, thereby generating highly unstable conditions within a storm cloud. <span class=\"g-partp\">Having been generated by this collision of air masses</span>, a tornado may materialise and dissipate within mere minutes, rendering it exceptionally difficult to predict with any degree of accuracy.</p>\n<p><span class=\"g-inv\">Rarely can meteorologists forecast a tornado's precise trajectory</span>, notwithstanding increasingly sophisticated radar systems developed to identify such storms as early as possible. Public warning systems subsequently alert residents within the affected area, affording them precious time in which to seek adequate shelter underground or within a reinforced structure.</p>\n<p>The destruction wrought by a tornado can be immense: buildings <span class=\"g-pass\">are frequently torn asunder</span>, vehicles <span class=\"g-pass\">are hurled considerable distances through the air</span>, and entire neighbourhoods can be levelled within mere seconds. Emergency services must therefore remain poised to respond with utmost urgency once a tornado has passed through an area.</p>\n<p>The United States experiences considerably more tornadoes than any other nation, largely attributable to its distinctive topography. This particular region, colloquially termed \"Tornado Alley,\" remains acutely vulnerable to such storms each spring.</p>\n<p>Notwithstanding decades of dedicated research, tornadoes remain among the least predictable of all natural disasters, serving as a stark reminder of nature's enduring capacity to defy human understanding.</p>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#e08b3f\"></span>Inversion (C1 marker)</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#9b59b6\"></span>Perfect Participle Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Present Simple Passive</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>Tornado facts and information</i>. Available at: nationalgeographic.com/environment/article/tornadoes</div>\n<div class=\"wc\">≈ 250 words</div>", "wc": "≈ 250 words"}, {"topic": "Volcanoes", "genre": "disaster", "level": "B2", "title": "Volcanoes: Fire from Within the Earth", "focus": "Long-term impact & human settlement", "html": "<div class=\"focus\"><b>Focus:</b> Long-term impact &amp; human settlement</div>\n<p>A volcano is an opening in the Earth's surface through which molten rock, ash, and gases escape from deep underground. When pressure builds up beneath the surface, it can <span class=\"voc\">result in</span> a violent eruption, sending lava and ash high into the sky.</p>\n<p>Volcanic eruptions have shaped the Earth for millions of years, creating islands, mountains, and fertile <span class=\"voc\">soil</span>. However, they can also be extremely dangerous, destroying <span class=\"voc\">settlements</span> and forcing entire <span class=\"voc\">populations</span> to evacuate at short notice.</p>\n<p><span class=\"g-part\">Having erupted</span>, a volcano can release enormous clouds of ash that block sunlight and disrupt air travel for weeks. Scientists <span class=\"voc\">continuously</span> monitor active volcanoes, <span class=\"voc\">identifying</span> small changes in temperature and pressure that may indicate an eruption is <span class=\"voc\">likely</span>.</p>\n<p>Local <span class=\"voc\">authorities</span> work closely with these scientists, using the data <span class=\"voc\">provided</span> to issue evacuation orders before a disaster occurs. <span class=\"voc\">Regrettably</span>, some eruptions happen with very little warning, leaving little time for a proper response.</p>\n<p>Despite the risks, millions of people continue to live near volcanoes, attracted by the rich, fertile land created by <span class=\"voc\">previous</span> eruptions. <span class=\"bonus\">Achieving a balance<span class=\"fn\">¹</span></span> between the benefits and the dangers of volcanic regions remains an <span class=\"voc\">ongoing</span> challenge for many communities.</p>\n<p>Volcanoes are a powerful reminder that the Earth beneath our feet is far from still. Although we have learned to predict eruptions more accurately, nature ultimately remains in control.</p>\n<div class=\"footnotes\">1 — достижение баланса</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>Volcano facts and information</i>. Available at: nationalgeographic.com/environment/article/volcanoes</div>\n<div class=\"wc\">≈ 230 words</div>", "wc": "≈ 230 words"}, {"topic": "Volcanoes", "genre": "disaster", "level": "B2+", "title": "Volcanoes: Fire from Within the Earth", "focus": "Long-term impact & human settlement", "html": "<div class=\"focus\"><b>Focus:</b> Long-term impact &amp; human settlement</div>\n<div class=\"whylevel\"><b>What makes this B2+, not B2</b>\n<ul>\n<li>Present Perfect Continuous replaces Present Perfect: <i>have been shaping</i> instead of <i>have shaped</i> — emphasises an ongoing process, not just a completed result</li>\n<li>\"Equally prove\" and \"considerably\" sharpen contrast and degree</li>\n<li>\"Exceedingly\" and \"scarcely any\" intensify without repeating \"very\"</li>\n<li>A cleft-like structure and appositive phrasing add formality to the closing idea</li>\n</ul>\n</div>\n<p>A volcano is an opening in the Earth's surface through which molten rock, ash, and volcanic gases escape from deep underground. When pressure accumulates beneath the surface, it can result in a violent eruption, sending lava and ash high into the atmosphere.</p>\n<p>Volcanic eruptions <span class=\"g-ppc\">have been shaping</span> the Earth's surface for millions of years, creating islands, mountains, and remarkably fertile soil. However, they can equally prove extremely dangerous, destroying settlements and forcing entire populations to evacuate at exceedingly short notice.</p>\n<p><span class=\"g-part\">Having erupted violently</span>, a volcano is capable of releasing enormous clouds of ash that block out sunlight and disrupt air travel for weeks at a time. Scientists continuously monitor active volcanoes, identifying subtle changes in temperature and pressure that may indicate an eruption is imminent.</p>\n<p>Local authorities therefore work closely alongside these scientists, using the data provided to issue evacuation orders well before a disaster occurs. Regrettably, certain eruptions happen with remarkably little warning, leaving scarcely any time for an adequate response.</p>\n<p>Despite these considerable risks, millions of people continue to live near volcanoes, drawn by the rich, fertile land created by previous eruptions. <span class=\"bonus\">Achieving an appropriate balance<span class=\"fn\">¹</span></span> between the benefits and the dangers of volcanic regions therefore remains an ongoing challenge for numerous communities.</p>\n<p>Volcanoes serve as a powerful reminder that the ground beneath our feet is far from static. Although scientists have considerably improved their ability to predict eruptions, nature ultimately remains firmly in control.</p>\n<div class=\"footnotes\">1 — достижение подходящего баланса</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>Volcano facts and information</i>. Available at: nationalgeographic.com/environment/article/volcanoes</div>\n<div class=\"wc\">≈ 245 words</div>", "wc": "≈ 245 words"}, {"topic": "Volcanoes", "genre": "disaster", "level": "C1", "title": "Volcanoes: Fire from Within the Earth", "focus": "Long-term impact & human settlement", "html": "<div class=\"focus\"><b>Focus:</b> Long-term impact &amp; human settlement</div>\n<div class=\"whylevel\"><b>What makes this C1, not B2+</b>\n<ul>\n<li><span class=\"g-inv\">Inversion</span>: <i>Rarely has the Earth's surface been shaped so profoundly...</i> — combines inversion with passive for maximum formality</li>\n<li>Elevated verbs: <i>constitutes, precipitate, obliterating, compelling, inhabit</i> instead of everyday equivalents</li>\n<li>\"In the final analysis\" as a formal closing hedge, typical of academic conclusions</li>\n<li>Dense noun phrases: <i>equilibrium between the benefits and dangers inherent to volcanic regions</i></li>\n</ul>\n</div>\n<p>A volcano constitutes an aperture in the Earth's surface through which molten rock, ash, and volcanic gases escape from deep underground. When pressure accumulates beneath the surface, it can precipitate a violent eruption, propelling lava and ash
