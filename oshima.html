{q:"Which structure divides a phenomenon into types/categories, each with its own paragraph?",opts:["Classification","Problem-Solution","Comparison","Process"],a:0},
{q:"Which structure follows: problem → why it's a problem → possible solutions → evaluation?",opts:["Problem-Solution","Descriptive-explanatory","Classification","Comparison"],a:0},
];

</script>
<script>
// ===================== UTIL =====================
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
async function storageGet(key, fallback){
  try{
    const r = await window.storage.get(key);
    return r ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function storageSet(key, value, retries=2){
  for(let attempt=0; attempt<=retries; attempt++){
    try{
      await window.storage.set(key, JSON.stringify(value));
      return true;
    }catch(e){
      if(attempt===retries){ console.error('storage set failed after retries', e); return false; }
      await new Promise(r=>setTimeout(r, 400*(attempt+1)));
    }
  }
}

const REQUIRED_ANSWERS = 25;
const PASS_RATIO = 0.6;

let lockState = null; // {date, unlocked, todayAnswered, todayCorrect}
let topicsLearned = [];
let quizHistory = [];
let essaysRead = []; // array of "topic|level" strings

let currentEssay = null; // {topic, level}
let quizSession = { pool: [], idx: 0, answered: 0, correct: 0 };

// ===================== INIT =====================
async function init(){
  lockState = await storageGet('lock-state', null);
  const t = todayStr();
  if(!lockState || lockState.date !== t){
    lockState = {date:t, unlocked:false, todayAnswered:0, todayCorrect:0};
    await storageSet('lock-state', lockState);
  }
  topicsLearned = await storageGet('topics-learned', []);
  quizHistory = await storageGet('quiz-history', []);
  essaysRead = await storageGet('essays-read', []);

  renderHeader();
  renderHome();
  renderLibrary();
  renderChapters();
  setupNav();
}

function setupNav(){
  document.querySelectorAll('nav.tabs button').forEach(btn=>{
    btn.addEventListener('click', ()=> switchView(btn.dataset.view));
  });
  document.getElementById('backToLib').addEventListener('click', ()=> switchView('library'));
  setupAudioControls();
  setupThemeToggle();
}

// ===================== THEME =====================
async function setupThemeToggle(){
  const pref = await storageGet('theme-pref', 'light');
  applyTheme(pref);
  document.getElementById('themeToggle').addEventListener('click', async ()=>{
    const current = document.body.classList.contains('dark') ? 'dark' : 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    await storageSet('theme-pref', next);
  });
}
function applyTheme(mode){
  document.body.classList.toggle('dark', mode==='dark');
  const btn = document.getElementById('themeToggle');
  if(btn) btn.textContent = mode==='dark' ? '☀️ Light mode' : '🌙 Dark mode';
}

let currentView = 'home';
function switchView(name){
  const prevView = currentView;
  currentView = name;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('on'));
  document.getElementById('view-'+name).classList.add('on');
  const navBtn = document.querySelector(`nav.tabs button[data-view="${name}"]`);
  if(navBtn) navBtn.classList.add('on');
  if(name==='quiz') startQuizSession();
  if(name==='home'){ renderHeader(); renderHome(); }
  if(name==='chapters') renderChapters();
  if(prevView==='quiz' && name!=='quiz'){ storageSet('lock-state', lockState); }
  if(prevView==='essay' && name!=='essay'){ stopAudio(); }
  window.scrollTo(0,0);
}

// ===================== HEADER / HOME =====================
function renderHeader(){
  const badge = document.getElementById('lockBadge');
  if(lockState.unlocked){
    badge.textContent = '🔓 unlocked';
    badge.className = 'lockbadge unlocked';
  } else {
    badge.textContent = '🔒 locked';
    badge.className = 'lockbadge locked';
  }
}

function renderHome(){
  const RING_C = 182.2; // 2*pi*29
  const totalTopics = 12;
  const readTopics = new Set(essaysRead.map(s=>s.split('|')[0])).size;
  const pct = Math.min(1, readTopics/totalTopics);
  document.getElementById('ringProgress').setAttribute('stroke-dashoffset', RING_C*(1-pct));
  document.getElementById('ringText').innerHTML = `${readTopics} <span>/ ${totalTopics}</span>`;

  const lifetimeAnswered = quizHistory.reduce((s,h)=>s+h.total,0) + lockState.todayAnswered;
  const lifetimeCorrect = quizHistory.reduce((s,h)=>s+h.correct,0) + lockState.todayCorrect;
  document.getElementById('miniAnswers').textContent = lifetimeAnswered;
  document.getElementById('miniAccuracy').textContent = lifetimeAnswered ? Math.round(100*lifetimeCorrect/lifetimeAnswered)+'%' : '—';
  document.getElementById('miniChapters').textContent = topicsLearned.length;

  const badge = document.getElementById('gateBadge');
  badge.textContent = lockState.unlocked ? '🔓 unlocked' : '🔒 locked';
  badge.className = 'lockbadge ' + (lockState.unlocked ? 'unlocked' : 'locked');
  document.getElementById('gateTitle').innerHTML = `<b>${lockState.todayAnswered}</b> of ${REQUIRED_ANSWERS} questions today`;
  const gatePct = Math.min(100, Math.round(100*lockState.todayAnswered/REQUIRED_ANSWERS));
  document.getElementById('gateBar').style.width = gatePct+'%';
  document.getElementById('gateMsg').textContent = lockState.unlocked
    ? `You answered ${lockState.todayAnswered} questions today (${Math.round(100*lockState.todayCorrect/lockState.todayAnswered)}% correct). Chapter logging is open until midnight.`
    : `Answer ${REQUIRED_ANSWERS} questions today — ${Math.round(PASS_RATIO*100)}%+ correct — and chapter logging opens until midnight.`;

  const cta = document.getElementById('ctaBtn');
  const ctaMain = document.getElementById('ctaMain');
  const ctaSub = document.getElementById('ctaSub');
  if(lockState.unlocked){
    cta.classList.add('done');
    ctaMain.textContent = "Today's gate is open ✓";
    ctaSub.textContent = 'Keep practising, or go log a chapter';
  } else {
    cta.classList.remove('done');
    ctaMain.textContent = "Start today's quiz →";
    const dateLabel = new Date().toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});
    ctaSub.textContent = `${dateLabel} · ${REQUIRED_ANSWERS - lockState.todayAnswered} questions to go`;
  }

  const listEl = document.getElementById('homeChapterList');
  if(topicsLearned.length===0){
    listEl.innerHTML = `<p style="font-size:14px;color:var(--mut2)">No chapters logged yet.</p>`;
  } else {
    listEl.innerHTML = topicsLearned.slice(-5).reverse().map(c=>
      `<div class="chapteritem"><span>${escapeHtml(c.name)}</span><span class="cdate">${c.date}</span></div>`
    ).join('');
  }
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ===================== LIBRARY =====================
const DISASTER_TOPICS = ["Wildfires","Avalanches","Lightning","Tsunamis","Tornadoes","Volcanoes","Earthquakes","Floods","Hurricanes"];
const GENRE_TOPICS = ["Informal Email","Blog / Online Post","Formal Letter"];
const LEVEL_COLORS = {B2:'#4F8A6B','B2+':'#9C86BE',C1:'#AE8342'};

function essaysForTopic(topic){
  return ESSAYS.filter(e=>e.topic===topic).sort((a,b)=>{
    const order = {B2:0,'B2+':1,C1:2};
    return order[a.level]-order[b.level];
  });
}

function renderLibrary(){
  const dGrid = document.getElementById('libDisasters');
  dGrid.innerHTML = DISASTER_TOPICS.map(t=>topicCardHtml(t)).join('');
  const gGrid = document.getElementById('libGenres');
  gGrid.innerHTML = GENRE_TOPICS.map(t=>topicCardHtml(t)).join('');

  document.querySelectorAll('.topiccard').forEach(c=>{
    c.addEventListener('click', ()=> openEssay(c.dataset.topic, 'B2'));
  });
}

function topicCardHtml(topic){
  const list = essaysForTopic(topic);
  const focus = list[0] ? list[0].focus : '';
  const dots = list.map(e=>`<span class="dot" style="background:${LEVEL_COLORS[e.level]}"></span>`).join('');
  return `<div class="topiccard" data-topic="${escapeHtml(topic)}">
    <div class="tname">${escapeHtml(topic)}</div>
    <div class="tgenre">${escapeHtml(focus)}</div>
    <div class="dots">${dots}</div>
  </div>`;
}

function openEssay(topic, level){
  currentEssay = {topic, level};
  const list = essaysForTopic(topic);
  const essay = list.find(e=>e.level===level) || list[0];
  currentEssay.level = essay.level;

  const row = document.getElementById('essayLevelRow');
  row.innerHTML = list.map(e=>{
    const cls = e.level==='B2'?'lvl-B2':(e.level==='B2+'?'lvl-B2plus':'lvl-C1');
    const off = e.level===essay.level ? '' : 'off';
    return `<button class="levelpill ${cls} ${off}" data-lvl="${e.level}">${e.level}</button>`;
  }).join('');
  row.querySelectorAll('.levelpill').forEach(btn=>{
    btn.addEventListener('click', ()=> openEssay(topic, btn.dataset.lvl));
  });

  document.getElementById('essayTitle').textContent = essay.title;
  document.getElementById('essayBody').innerHTML = essay.html;
  addTooltips();

  const key = topic+'|'+essay.level;
  if(!essaysRead.includes(key)){
    essaysRead.push(key);
    storageSet('essays-read', essaysRead);
  }

  stopAudio();
  document.getElementById('audioLoopToggle').checked = false;

  renderMiniQuiz(topic);
  switchView('essay');
}

// ===================== READ ALOUD =====================
let speechUtterance = null;
let isPlaying = false;

function essayPlainText(essay){
  const div = document.createElement('div');
  div.innerHTML = essay.html;
  // strip footnote/legend/refs/wc/structure chrome — read only the actual essay prose
  div.querySelectorAll('.footnotes,.struct-legend,.glegend,.refs,.wc,.struct-tag').forEach(el=>el.remove());
  return div.textContent.replace(/\s+/g,' ').trim();
}

function pickEnglishVoice(){
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v=>v.lang==='en-GB') || voices.find(v=>v.lang && v.lang.startsWith('en')) || voices[0];
}

function speakEssay(){
  if(!currentEssay) return;
  const essay = essaysForTopic(currentEssay.topic).find(e=>e.level===currentEssay.level);
  const text = essayPlainText(essay);

  speechUtterance = new SpeechSynthesisUtterance(text);
  speechUtterance.rate = 0.95;
  speechUtterance.pitch = 1;
  const voice = pickEnglishVoice();
  if(voice) speechUtterance.voice = voice;

  speechUtterance.onend = ()=>{
    if(document.getElementById('audioLoopToggle').checked && isPlaying){
      speakEssay(); // loop: read again
    } else {
      isPlaying = false;
      updateAudioBtn();
    }
  };
  speechUtterance.onerror = ()=>{
    isPlaying = false;
    updateAudioBtn();
  };

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(speechUtterance);
  isPlaying = true;
  updateAudioBtn();
}

function stopAudio(){
  window.speechSynthesis.cancel();
  isPlaying = false;
  updateAudioBtn();
}

function updateAudioBtn(){
  const btn = document.getElementById('audioPlayBtn');
  if(!btn) return;
  if(isPlaying){
    btn.textContent = '⏸ Stop reading';
    btn.classList.add('playing');
  } else {
    btn.textContent = '▶ Read aloud';
    btn.classList.remove('playing');
  }
}

function setupAudioControls(){
  document.getElementById('audioPlayBtn').addEventListener('click', ()=>{
    if(isPlaying){ stopAudio(); }
    else { speakEssay(); }
  });
}

const TOOLTIP_MAP = {
  'voc': 'New Level 4 vocabulary',
  'bonus': 'Bonus academic phrase — translation in the footnote below',
  'g-pass': 'Passive Voice',
  'g-ppc': 'Present Perfect Continuous Active',
  'g-part': 'Perfect Participle Active',
  'g-partp': 'Perfect Participle Passive',
  'g-ger': 'Gerund Active',
  'g-inv': 'Inversion (C1 marker)',
  'g-link': "Linking word — teacher's sheet"
};
function addTooltips(){
  const body = document.getElementById('essayBody');
  Object.keys(TOOLTIP_MAP).forEach(cls=>{
    body.querySelectorAll('.'+cls).forEach(el=>{
      el.title = TOOLTIP_MAP[cls];
    });
  });
}

function renderMiniQuiz(topic){
  const card = document.getElementById('miniQuizCard');
  const essay = ESSAYS.find(e=>e.topic===currentEssay.topic && e.level===currentEssay.level);

  const presentClasses = Object.keys(TOOLTIP_MAP).filter(cls=> essay.html.includes('class="'+cls+'"'));
  // grammar-only (skip voc/bonus, too easy/not meaningful as quiz labels)
  const grammarClasses = presentClasses.filter(c=>c!=='voc' && c!=='bonus');

  if(grammarClasses.length===0){
    card.innerHTML = `<h3 style="font-size:15px;margin-bottom:6px">Quick check</h3>
      <p style="font-size:13px;color:var(--mut)">No grammar markers to quiz on this page.</p>`;
    return;
  }

  const correctCls = grammarClasses[Math.floor(Math.random()*grammarClasses.length)];
  const correctLabel = TOOLTIP_MAP[correctCls];
  const allLabels = Object.values(TOOLTIP_MAP).filter(l=>l!==correctLabel && l!==TOOLTIP_MAP['voc'] && l!==TOOLTIP_MAP['bonus']);
  const distractors = shuffle(allLabels).slice(0,3);
  const opts = shuffle([correctLabel, ...distractors]);

  card.innerHTML = `<h3 style="font-size:15px;margin-bottom:10px">Quick check</h3>
    <p style="font-size:14px;margin-bottom:10px">Which grammar structure appears highlighted in <b>this</b> version of the essay? (Scroll up and look at the colours if you're not sure.)</p>
    <div id="miniOpts"></div>
    <button class="btn btn-ghost" id="miniRetryBtn" style="margin-top:10px;display:none">Try another question</button>`;
  const optsEl = document.getElementById('miniOpts');
  optsEl.innerHTML = opts.map(o=>`<button class="qopt" data-correct="${o===correctLabel}">${escapeHtml(o)}</button>`).join('');
  optsEl.querySelectorAll('.qopt').forEach(b=>{
    b.addEventListener('click', ()=>{
      optsEl.querySelectorAll('.qopt').forEach(x=>{
        x.disabled = true;
        if(x.dataset.correct==='true') x.classList.add('correct');
      });
      if(b.dataset.correct!=='true') b.classList.add('wrong');
      document.getElementById('miniRetryBtn').style.display = 'block';
    });
  });
  document.getElementById('miniRetryBtn').addEventListener('click', ()=> renderMiniQuiz(topic));
}

// ===================== QUIZ ENGINE =====================
function startQuizSession(){
  quizSession = { pool: shuffle(QUIZ_BANK), idx:0, answered:0, correct:0 };
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const area = document.getElementById('quizArea');
  if(quizSession.idx >= quizSession.pool.length){
    quizSession.pool = shuffle(QUIZ_BANK);
    quizSession.idx = 0;
  }
  const q = quizSession.pool[quizSession.idx];
  const optOrder = shuffle(q.opts.map((o,i)=>({o,i})));

  area.innerHTML = `<div class="quizbox">
    <div class="qprogress">Today: ${lockState.todayAnswered} / ${REQUIRED_ANSWERS} &nbsp;·&nbsp; Session score: ${quizSession.correct}/${quizSession.answered}</div>
    <div class="qtext">${escapeHtml(q.q)}</div>
    <div id="qopts"></div>
    <div style="margin-top:14px;display:flex;gap:8px">
      <button class="btn btn-ghost" id="finishQuizBtn">Finish for now</button>
    </div>
  </div>`;

  const optsEl = document.getElementById('qopts');
  optsEl.innerHTML = optOrder.map(({o,i})=>`<button class="qopt" data-i="${i}">${escapeHtml(o)}</button>`).join('');
  optsEl.querySelectorAll('.qopt').forEach(btn=>{
    btn.addEventListener('click', ()=> answerQuiz(q, btn, optsEl));
  });
  document.getElementById('finishQuizBtn').addEventListener('click', finishQuizSession);
}

async function answerQuiz(q, btn, optsEl){
  const chosen = parseInt(btn.dataset.i, 10);
  const isCorrect = chosen === q.a;
  optsEl.querySelectorAll('.qopt').forEach(x=>{
    x.disabled = true;
    if(parseInt(x.dataset.i,10) === q.a) x.classList.add('correct');
  });
  if(!isCorrect) btn.classList.add('wrong');

  quizSession.answered++;
  if(isCorrect) quizSession.correct++;
  lockState.todayAnswered++;
  if(isCorrect) lockState.todayCorrect++;
  renderHeader();

  const justUnlocked = !lockState.unlocked && lockState.todayAnswered >= REQUIRED_ANSWERS && (lockState.todayCorrect/lockState.todayAnswered) >= PASS_RATIO;
  if(justUnlocked){
    lockState.unlocked = true;
    renderHeader();
  }

  // Batch writes: save every 5 answers, or immediately on unlock, to avoid hammering storage
  if(justUnlocked || lockState.todayAnswered % 5 === 0){
    await storageSet('lock-state', lockState);
  }

  setTimeout(()=>{
    quizSession.idx++;
    renderQuizQuestion();
  }, 900);
}

async function finishQuizSession(){
  await storageSet('lock-state', lockState);
  quizHistory.push({date: todayStr(), total: quizSession.answered, correct: quizSession.correct});
  await storageSet('quiz-history', quizHistory);
  const area = document.getElementById('quizArea');
  const pct = quizSession.answered ? Math.round(100*quizSession.correct/quizSession.answered) : 0;
  area.innerHTML = `<div class="quizbox" style="text-align:center">
    <h3 style="margin-bottom:8px">Session complete</h3>
    <p style="font-size:15px;color:#666;margin:0 0 14px">${quizSession.correct} / ${quizSession.answered} correct (${pct}%)</p>
    <button class="btn btn-primary" onclick="startQuizSession()">Answer more</button>
  </div>`;
}

// ===================== CHAPTERS (unlock gate) =====================
function renderChapters(){
  const area = document.getElementById('chaptersArea');
  let html = '';
  if(!lockState.unlocked){
    const pct = Math.min(100, Math.round(100*lockState.todayAnswered/REQUIRED_ANSWERS));
    html += `<div class="lockscreen">
      <div class="emoji">🔒</div>
      <h3>Adding new topics is locked</h3>
      <p>Answer ${REQUIRED_ANSWERS} quiz questions today (${Math.round(PASS_RATIO*100)}%+ correct) to unlock.</p>
      <div class="progressbar"><div class="progressbar-fill" style="width:${pct}%"></div></div>
      <p style="font-size:12px;color:#999;margin:8px 0 14px">${lockState.todayAnswered} / ${REQUIRED_ANSWERS} answered today</p>
      <button class="btn btn-primary" onclick="switchView('quiz')">Go to Quiz</button>
    </div>`;
  } else {
    html += `<div class="card">
      <h3 style="font-size:16px;margin-bottom:10px">✅ Unlocked — log what you learned today</h3>
      <input type="text" id="newChapterInput" placeholder="e.g. Grammar in Use Unit 5-6, Present Perfect">
      <button class="btn btn-primary btn-block" id="addChapterBtn">Add topic</button>
    </div>`;
  }
  html += `<div class="sectiontitle">All logged chapters</div>`;
  if(topicsLearned.length===0){
    html += `<p style="font-size:14px;color:#999">Nothing logged yet.</p>`;
  } else {
    html += topicsLearned.slice().reverse().map(c=>
      `<div class="chapteritem"><span>${escapeHtml(c.name)}</span><span class="cdate">${c.date}</span></div>`
    ).join('');
  }
  area.innerHTML = html;

  const addBtn = document.getElementById('addChapterBtn');
  if(addBtn){
    addBtn.addEventListener('click', async ()=>{
      const input = document.getElementById('newChapterInput');
      const val = input.value.trim();
      if(!val) return;
      topicsLearned.push({name: val, date: todayStr()});
      await storageSet('topics-learned', topicsLearned);
      input.value = '';
      renderChapters();
      renderHome();
    });
  }
}

init();

</script>
</body>
</html>
