 high into the atmosphere.</p>\n<p><span class=\"g-inv\">Rarely has the Earth's surface been shaped so profoundly</span> by any single natural process as by volcanic eruptions, which <span class=\"g-ppc\">have been moulding</span> islands, mountains, and remarkably fertile soil for millions of years. Notwithstanding these benefits, eruptions can prove extraordinarily dangerous, obliterating settlements and compelling entire populations to evacuate at exceedingly short notice.</p>\n<p><span class=\"g-part\">Having erupted violently</span>, a volcano is capable of releasing vast clouds of ash that obscure sunlight and disrupt air travel for weeks at a time. Scientists continuously monitor active volcanoes, identifying subtle fluctuations in temperature and pressure that may signal an imminent eruption.</p>\n<p>Local authorities therefore collaborate closely with these scientists, utilising the data provided to issue evacuation orders well in advance of disaster. Regrettably, certain eruptions occur with remarkably little warning, leaving scarcely any time for an adequate response.</p>\n<p>Notwithstanding these considerable risks, millions of people continue to inhabit the vicinity of volcanoes, drawn by the rich, fertile land created by previous eruptions. <span class=\"bonus\">Achieving an appropriate equilibrium<span class=\"fn\">¹</span></span> between the benefits and dangers inherent to volcanic regions therefore remains an ongoing challenge for numerous communities.</p>\n<p>Volcanoes serve as a stark reminder that the ground beneath our feet is far from static. Although scientists have considerably refined their capacity to predict eruptions, nature ultimately remains, in the final analysis, firmly in control.</p>\n<div class=\"footnotes\">1 — достижение соответствующего равновесия</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#e08b3f\"></span>Inversion (C1 marker)</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>Volcano facts and information</i>. Available at: nationalgeographic.com/environment/article/volcanoes</div>\n<div class=\"wc\">≈ 245 words</div>", "wc": "≈ 245 words"}, {"topic": "Earthquakes", "genre": "disaster", "level": "B2", "title": "Earthquakes: When the Ground Shakes", "focus": "Historical case study & prevention technology", "html": "<div class=\"focus\"><b>Focus:</b> Historical case study &amp; prevention technology</div>\n<p>An earthquake occurs when tectonic plates beneath the Earth's surface suddenly shift, releasing enormous amounts of energy. This energy travels through the ground in the form of powerful waves, causing the surface to shake, sometimes violently.</p>\n<p>Most earthquakes happen along fault lines, where two plates meet and grind against each other. <span class=\"g-part\">Having built up pressure over many years</span>, these plates can suddenly slip, resulting in an earthquake that lasts only seconds but can cause devastating damage. For instance, the 2011 earthquake in Japan released such force that it triggered a tsunami affecting thousands of people along the coast.</p>\n<p>Cities located in earthquake-prone regions <span class=\"g-pass\">are required</span> to follow strict building regulations, designed to <span class=\"voc\">reduce</span> the risk of collapse. <span class=\"voc\">Nevertheless</span>, older buildings in <span class=\"voc\">crowded</span> <span class=\"voc\">urban</span> areas remain particularly vulnerable, especially in less developed countries.</p>\n<p>Once an earthquake strikes, rescuers must <span class=\"voc\">react</span> immediately, searching through the debris for survivors. Emergency authorities coordinate this response, <span class=\"voc\">providing</span> <span class=\"voc\">first aid</span>, shelter, and supplies to those affected. <span class=\"voc\">Regrettably</span>, aftershocks often follow, putting rescue teams at further risk.</p>\n<p>Scientists <span class=\"g-ppc\">have been studying</span> seismic activity for decades, yet accurately <span class=\"g-ger\">predicting the exact time and location of an earthquake</span> <span class=\"bonus\">remains impossible<span class=\"fn\">¹</span></span>. Instead, researchers focus on <span class=\"g-ger\">identifying high-risk zones and improving early warning systems</span> that can provide a few crucial seconds of notice.</p>\n<p>Earthquakes remind us that even the most solid ground can become unpredictable within moments, making preparedness essential for millions of people worldwide.</p>\n<div class=\"footnotes\">1 — остаётся невозможным</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Present Simple Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>Earthquake facts and information</i>. Available at: nationalgeographic.com/environment/article/earthquakes</div>\n<div class=\"wc\">≈ 245 words</div>", "wc": "≈ 245 words"}, {"topic": "Earthquakes", "genre": "disaster", "level": "B2+", "title": "Earthquakes: When the Ground Shakes", "focus": "Historical case study & prevention technology", "html": "<div class=\"focus\"><b>Focus:</b> Historical case study &amp; prevention technology</div>\n<div class=\"whylevel\"><b>What makes this B2+, not B2</b>\n<ul>\n<li>\"Persistently\" and \"considerable\" replace plain descriptions of the plates' movement</li>\n<li>\"Rendering preparedness absolutely essential\" replaces a simpler final clause</li>\n<li>\"At present\" hedges the claim about prediction, sounding more academically cautious</li>\n<li>\"Methodically\" and \"essential supplies\" add precision to the rescue description</li>\n</ul>\n</div>\n<p>An earthquake occurs when tectonic plates beneath the Earth's surface suddenly shift, releasing enormous quantities of energy. This energy subsequently travels through the ground in the form of powerful waves, causing the surface to shake, occasionally with considerable violence.</p>\n<p>Most earthquakes occur along fault lines, where two plates meet and grind persistently against one another. <span class=\"g-part\">Having built up considerable pressure over many years</span>, these plates can suddenly slip, resulting in an earthquake that lasts mere seconds yet can inflict devastating damage. For instance, the 2011 earthquake in Japan released such immense force that it triggered a tsunami affecting thousands of people along the coastline.</p>\n<p>Cities situated within earthquake-prone regions <span class=\"g-pass\">are required to adhere</span> to strict building regulations, specifically designed to minimise the risk of structural collapse. Nevertheless, older buildings within densely populated urban areas remain particularly vulnerable, especially throughout less developed countries.</p>\n<p>Once an earthquake strikes, rescuers must react without delay, searching methodically through the debris for survivors. Emergency authorities coordinate this response, providing first aid, shelter, and essential supplies to those affected. Regrettably, aftershocks frequently follow, placing rescue teams at further considerable risk.</p>\n<p>Scientists <span class=\"g-ppc\">have been studying</span> seismic activity for decades; nevertheless, accurately <span class=\"g-ger\">predicting the exact time and location of an earthquake</span> <span class=\"bonus\">remains, at present, impossible<span class=\"fn\">¹</span></span>. Instead, researchers focus on <span class=\"g-ger\">identifying high-risk zones and refining early warning systems</span> capable of providing a few crucial seconds of advance notice.</p>\n<p>Earthquakes serve as a reminder that even the most solid ground can become unpredictable within moments, rendering preparedness absolutely essential for millions of people worldwide.</p>\n<div class=\"footnotes\">1 — на данный момент остаётся невозможным</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Present Simple Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>Earthquake facts and information</i>. Available at: nationalgeographic.com/environment/article/earthquakes</div>\n<div class=\"wc\">≈ 260 words</div>", "wc": "≈ 260 words"}, {"topic": "Earthquakes", "genre": "disaster", "level": "C1", "title": "Earthquakes: When the Ground Shakes", "focus": "Historical case study & prevention technology", "html": "<div class=\"focus\"><b>Focus:</b> Historical case study &amp; prevention technology</div>\n<div class=\"whylevel\"><b>What makes this C1, not B2+</b>\n<ul>\n<li><span class=\"g-inv\">Inversion</span>: <i>Rarely has this destructive potential been more starkly illustrated...</i></li>\n<li>All five tracked grammar structures appear together in a single essay — a genuine C1 showcase</li>\n<li>\"Precipitating\" and \"propagates\" replace everyday verbs for scientific precision</li>\n<li>Semicolons link the prediction limitation to the researchers' response as one continuous thought</li>\n</ul>\n</div>\n<p>An earthquake occurs when tectonic plates beneath the Earth's surface suddenly shift, releasing enormous quantities of stored energy, which subsequently propagates through the ground in the form of powerful seismic waves, causing the surface to shake, at times with considerable violence.</p>\n<p>Most earthquakes occur along fault lines, where two plates meet and grind persistently against one another. <span class=\"g-part\">Having accumulated considerable pressure over many years</span>, these plates can suddenly slip, precipitating an earthquake that lasts mere seconds yet may inflict catastrophic damage. <span class=\"g-inv\">Rarely has this destructive potential been more starkly illustrated</span> than by the 2011 earthquake in Japan, which released such immense force that it triggered a tsunami affecting thousands of people along the coastline.</p>\n<p>Cities situated within earthquake-prone regions <span class=\"g-pass\">are required to adhere</span> to stringent building regulations, specifically designed to minimise the risk of structural collapse; nevertheless, older buildings within densely populated urban areas remain particularly vulnerable, especially throughout less developed countries.</p>\n<p>Once an earthquake strikes, rescuers must react without delay, searching methodically through the debris for survivors, while emergency authorities coordinate the wider response, providing first aid, shelter, and essential supplies to those affected. Regrettably, aftershocks frequently follow, placing rescue teams at further considerable risk.</p>\n<p>Scientists <span class=\"g-ppc\">have been investigating</span> seismic activity for decades; nevertheless, accurately <span class=\"g-ger\">predicting the precise time and location of an earthquake</span> <span class=\"bonus\">remains, at present, an impossibility<span class=\"fn\">¹</span></span>. Instead, researchers focus on <span class=\"g-ger\">identifying high-risk zones and refining early-warning systems</span> capable of affording a few crucial seconds of advance notice.</p>\n<p>Earthquakes serve as a stark reminder that even the most solid ground can become unpredictable within moments, rendering preparedness an absolute necessity for millions of people worldwide.</p>\n<div class=\"footnotes\">1 — на данный момент остаётся невозможным</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#e08b3f\"></span>Inversion (C1 marker)</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Present Simple Passive</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>Earthquake facts and information</i>. Available at: nationalgeographic.com/environment/article/earthquakes</div>\n<div class=\"wc\">≈ 260 words</div>", "wc": "≈ 260 words"}, {"topic": "Floods", "genre": "disaster", "level": "B2", "title": "Floods: Water Out of Control", "focus": "Economic impact & urban planning", "html": "<div class=\"focus\"><b>Focus:</b> Economic impact &amp; urban planning</div>\n<p>A <span class=\"voc\">flood</span> occurs when water overflows onto land that is normally dry, often as a result of heavy rainfall, melting snow, or a <span class=\"voc\">dam</span> failure. Floods are among the most common natural disasters, affecting millions of people around the world every year.</p>\n<p>Flash floods develop extremely rapidly, sometimes within minutes of heavy rain, giving residents very little time to <span class=\"voc\">react</span>. <span class=\"g-part\">Having risen suddenly</span>, floodwater can sweep away vehicles, damage buildings, and, <span class=\"voc\">regrettably</span>, cause loss of life in <span class=\"voc\">crowded</span> <span class=\"voc\">urban</span> areas.</p>\n<p>Local <span class=\"voc\">authorities</span> closely monitor rivers and weather conditions, using this data to <span class=\"voc\">identify</span> areas at risk and issue timely public warnings. <span class=\"voc\">Reasonable</span> precautions, such as <span class=\"g-ger\">avoiding flooded roads</span>, can significantly reduce the number of casualties.</p>\n<p>The <span class=\"voc\">impact</span> of flooding extends far beyond the immediate destruction. Contaminated water supplies can create health hazards, while damaged infrastructure disrupts daily life for weeks or even months afterwards. <span class=\"voc\">As a result</span>, recovery from a major flood is often a long and costly process.</p>\n<p>Engineers <span class=\"g-ppc\">have been developing</span> improved flood defences, including stronger dams and drainage systems, to reduce risk in vulnerable areas. <span class=\"bonus\">Playing a vital role<span class=\"fn\">¹</span></span> in prevention is also urban planning, which increasingly considers flood risk when approving new construction.</p>\n<p>Despite these efforts, floods remain a persistent threat, particularly as climate change continues to increase the frequency of extreme rainfall around the world.</p>\n<div class=\"footnotes\">1 — играющий жизненно важную роль</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>What causes flash floods? Here's how they get so destructive so quickly</i>. Available at: nationalgeographic.com/environment/article/floods</div>\n<div class=\"wc\">≈ 240 words</div>", "wc": "≈ 240 words"}, {"topic": "Floods", "genre": "disaster", "level": "B2+", "title": "Floods: Water Out of Control", "focus": "Economic impact & urban planning", "html": "<div class=\"focus\"><b>Focus:</b> Economic impact &amp; urban planning</div>\n<div class=\"whylevel\"><b>What makes this B2+, not B2</b>\n<ul>\n<li>A new Present Simple Passive appears: <i>flood risk is now routinely considered</i> — objective, policy-level tone</li>\n<li>\"Consequently\" and \"moreover\" replace \"as a result\" and \"also\" for variety</li>\n<li>A cleft sentence: <i>It is urban planning, moreover, that plays...</i> mirrors the Avalanches B2+ technique — same structure, different topic</li>\n<li>Doubled time expressions: <i>for weeks, or even months, afterwards</i> — a common academic cohesion device</li>\n</ul>\n</div>\n<p>A flood occurs when water overflows onto land that is normally dry, frequently as a result of heavy rainfall, melting snow, or the failure of a dam. Floods are among the most common of all natural disasters, affecting millions of people across the world every single year.</p>\n<p>Flash floods develop with extraordinary rapidity, occasionally within mere minutes of heavy rain, leaving residents very little time in which to react. <span class=\"g-part\">Having risen suddenly and without warning</span>, floodwater can sweep away vehicles, damage buildings, and, regrettably, claim lives within densely populated urban areas.</p>\n<p>Local authorities closely monitor rivers and prevailing weather conditions, utilising this data to identify areas at particular risk and issue timely public warnings. Reasonable precautions — <span class=\"g-ger\">avoiding flooded roads</span>, for example — can significantly reduce the overall number of casualties.</p>\n<p>The impact of flooding extends considerably beyond the immediate destruction it causes. Contaminated water supplies can create serious health hazards, while damaged infrastructure disrupts daily life for weeks, or even months, afterwards. Consequently, recovery from a major flood is frequently a lengthy and exceedingly costly process.</p>\n<p>Engineers <span class=\"g-ppc\">have been developing</span> increasingly sophisticated flood defences, including stronger dams and improved drainage systems, in order to reduce risk within vulnerable areas. It is urban planning, moreover, that plays an increasingly vital role in prevention, particularly as flood risk <span class=\"g-pass\">is now routinely considered</span> when approving new construction.</p>\n<p>Despite these ongoing efforts, floods remain a persistent and growing threat, particularly as climate change continues to increase the frequency of extreme rainfall events worldwide.</p>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Present Simple Passive</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>What causes flash floods? Here's how they get so destructive so quickly</i>. Available at: nationalgeographic.com/environment/article/floods</div>\n<div class=\"wc\">≈ 260 words</div>", "wc": "≈ 260 words"}, {"topic": "Floods", "genre": "disaster", "level": "C1", "title": "Floods: Water Out of Control", "focus": "Economic impact & urban planning", "html": "<div class=\"focus\"><b>Focus:</b> Economic impact &amp; urban planning</div>\n<div class=\"whylevel\"><b>What makes this C1, not B2+</b>\n<ul>\n<li><span class=\"g-inv\">Inversion</span>: <i>Rarely is the true scale of flood risk appreciated...</i></li>\n<li>Verb precision: <i>rank among, afford, inflicts, generate, factored into</i> instead of everyday equivalents</li>\n<li>A colon introduces a two-part explanation instead of a new sentence</li>\n<li>\"Indeed\" inserted mid-sentence for rhetorical emphasis — a hallmark of confident academic style</li>\n</ul>\n</div>\n<p>A flood occurs when water overflows onto land that is normally dry, frequently as a consequence of heavy rainfall, melting snow, or dam failure. Floods rank among the most common of all natural disasters, affecting millions of people across the globe each year.</p>\n<p>Flash floods develop with extraordinary rapidity, occasionally within mere minutes of heavy rainfall, affording residents scarcely any time in which to react. <span class=\"g-part\">Having risen suddenly and without warning</span>, floodwater can sweep away vehicles, inflict damage upon buildings, and, regrettably, claim lives within densely populated urban areas.</p>\n<p><span class=\"g-inv\">Rarely is the true scale of flood risk appreciated</span> until disaster strikes. Local authorities therefore monitor rivers and prevailing weather conditions closely, utilising such data to identify vulnerable areas and issue timely public warnings. Reasonable precautions — <span class=\"g-ger\">avoiding flooded roads</span>, for instance — can substantially reduce the overall number of casualties.</p>\n<p>The impact of flooding extends considerably beyond the immediate destruction it inflicts: contaminated water supplies can generate serious health hazards, while damaged infrastructure disrupts daily life for weeks, or indeed months, thereafter. Consequently, recovery from a major flood constitutes a lengthy and exceedingly costly undertaking.</p>\n<p>Engineers <span class=\"g-ppc\">have been devising</span> increasingly sophisticated flood defences, including reinforced dams and improved drainage systems, in order to mitigate risk within vulnerable areas. It is urban planning, moreover, that has been playing an increasingly indispensable role in prevention, particularly as flood risk <span class=\"g-pass\">is now routinely factored into</span> construction approval processes.</p>\n<p>Notwithstanding these ongoing efforts, floods remain a persistent and, indeed, growing threat, particularly as climate change continues to intensify the frequency of extreme rainfall events worldwide.</p>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#e08b3f\"></span>Inversion (C1 marker)</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Present Simple Passive</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>What causes flash floods? Here's how they get so destructive so quickly</i>. Available at: nationalgeographic.com/environment/article/floods</div>\n<div class=\"wc\">≈ 260 words</div>", "wc": "≈ 260 words"}, {"topic": "Hurricanes", "genre": "disaster", "level": "B2", "title": "Hurricanes: Giants of the Ocean", "focus": "International relief & climate trends", "html": "<div class=\"focus\"><b>Focus:</b> International relief &amp; climate trends</div>\n<p>A <span class=\"voc\">hurricane</span> is a powerful, rotating storm that forms over warm ocean water, fuelled by heat and moisture rising from the sea's surface. As the storm grows stronger, it can develop wind speeds exceeding 250 kilometres per hour, making it one of the most destructive natural events on Earth.</p>\n<p>Hurricanes typically form in tropical regions and can travel thousands of kilometres <span class=\"g-ger\">before reaching land</span>. <span class=\"g-part\">Having gathered strength over the open ocean</span>, a hurricane can devastate entire coastal <span class=\"voc\">settlements</span> within hours of making landfall.</p>\n<p>Meteorological <span class=\"voc\">agencies</span> continuously track these storms using satellites, <span class=\"voc\">identifying</span> their <span class=\"voc\">likely</span> path and issuing public warnings well in advance. This early notice gives residents time to prepare <span class=\"voc\">emergency</span> kits, secure their homes, and, if necessary, evacuate to safer locations.</p>\n<p>The destruction caused by a hurricane often <span class=\"voc\">results in</span> flooding, power outages, and significant damage to infrastructure. <span class=\"voc\">Regrettably</span>, the recovery process can take months or even years, particularly in less developed regions with limited resources.</p>\n<p>International <span class=\"voc\">cooperation</span> <span class=\"bonus\">has been proving essential<span class=\"fn\">¹</span></span> in hurricane relief efforts, as countries provide aid, supplies, and rescuers to affected communities. <span class=\"voc\">Nevertheless</span>, the growing frequency and intensity of hurricanes, linked to rising ocean temperatures, remains a serious concern for scientists worldwide.</p>\n<p>Hurricanes serve as a powerful reminder of nature's force, and <span class=\"g-ger\">preparing communities to react quickly</span> remains the most effective way to reduce their devastating impact.</p>\n<div class=\"footnotes\">1 — доказывающее свою значимость</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>What Are Hurricanes and How Do They Form?</i> Available at: nationalgeographic.com/environment/article/hurricanes-typhoons-cyclones</div>\n<div class=\"wc\">≈ 245 words</div>", "wc": "≈ 245 words"}, {"topic": "Hurricanes", "genre": "disaster", "level": "B2+", "title": "Hurricanes: Giants of the Ocean", "focus": "International relief & climate trends", "html": "<div class=\"focus\"><b>Focus:</b> International relief &amp; climate trends</div>\n<div class=\"whylevel\"><b>What makes this B2+, not B2</b>\n<ul>\n<li>\"Rendering it\" replaces \"making it\" — a more formal participial connector</li>\n<li>\"Affords residents sufficient time\" replaces \"gives residents time\" — more formal verb + noun combination</li>\n<li>A dash sets off \"closely linked to rising ocean temperatures\" as a formal aside</li>\n<li>\"By a considerable margin\" strengthens the closing claim, echoing the same phrase used across other B2+ essays for consistency</li>\n</ul>\n</div>\n<p>A hurricane is an extremely powerful, rotating storm that forms over warm ocean water, fuelled by heat and moisture rising continuously from the sea's surface. As the storm intensifies, it can develop wind speeds exceeding 250 kilometres per hour, rendering it one of the most destructive natural events on Earth.</p>\n<p>Hurricanes typically form within tropical regions and are capable of travelling thousands of kilometres <span class=\"g-ger\">before reaching land</span>. <span class=\"g-part\">Having gathered considerable strength over the open ocean</span>, a hurricane can devastate entire coastal settlements within hours of making landfall.</p>\n<p>Meteorological agencies continuously track these storms using satellite technology, identifying their likely trajectory and issuing public warnings well in advance. This early notice affords residents sufficient time to prepare emergency kits, secure their properties, and, where necessary, evacuate to safer locations.</p>\n<p>The destruction caused by a hurricane frequently results in extensive flooding, prolonged power outages, and significant damage to infrastructure. Regrettably, the recovery process can take months, or even years, particularly within less developed regions possessing limited resources.</p>\n<p>International cooperation has <span class=\"bonus\">increasingly been proving essential<span class=\"fn\">¹</span></span> to hurricane relief efforts, as countries provide aid, supplies, and rescue personnel to affected communities. Nevertheless, the growing frequency and intensity of hurricanes — closely linked to rising ocean temperatures — remains a matter of serious concern for scientists worldwide.</p>\n<p>Hurricanes serve as a powerful reminder of nature's raw force, and <span class=\"g-ger\">preparing communities to react swiftly</span> remains, by a considerable margin, the most effective means of reducing their devastating impact.</p>\n<div class=\"footnotes\">1 — всё больше доказывает свою значимость</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>What Are Hurricanes and How Do They Form?</i> Available at: nationalgeographic.com/environment/article/hurricanes-typhoons-cyclones</div>\n<div class=\"wc\">≈ 250 words</div>", "wc": "≈ 250 words"}, {"topic": "Hurricanes", "genre": "disaster", "level": "C1", "title": "Hurricanes: Giants of the Ocean", "focus": "International relief & climate trends", "html": "<div class=\"focus\"><b>Focus:</b> International relief &amp; climate trends</div>\n<div class=\"whylevel\"><b>What makes this C1, not B2+</b>\n<ul>\n<li><span class=\"g-inv\">Inversion</span>: <i>Rarely can meteorological agencies predict a hurricane's precise trajectory...</i></li>\n<li>\"Constitutes\" and \"traversing\" replace \"is\" and \"travelling\" for register</li>\n<li>\"Notwithstanding continuous satellite tracking\" — a formal concessive phrase replacing \"using satellites\"</li>\n<li>\"Untamed\" and \"with due swiftness\" add rhetorical weight to the closing sentence</li>\n</ul>\n</div>\n<p>A hurricane constitutes an extremely powerful, rotating storm that forms over warm ocean water, fuelled by heat and moisture rising continuously from the sea's surface. As the storm intensifies, it may develop wind speeds exceeding 250 kilometres per hour, rendering it among the most destructive natural phenomena on Earth.</p>\n<p>Hurricanes typically form within tropical regions and are capable of traversing thousands of kilometres <span class=\"g-ger\">before reaching land</span>. <span class=\"g-part\">Having amassed considerable strength over the open ocean</span>, a hurricane can devastate entire coastal settlements within hours of making landfall.</p>\n<p><span class=\"g-inv\">Rarely can meteorological agencies predict a hurricane's precise trajectory</span> with absolute certainty, notwithstanding continuous satellite tracking that enables early identification of likely paths and the timely issuance of public warnings. This advance notice affords residents sufficient time to prepare emergency provisions, secure their properties, and, where necessary, evacuate to safer locations.</p>\n<p>The destruction wrought by a hurricane frequently results in extensive flooding, prolonged power outages, and substantial damage to infrastructure. Regrettably, the recovery process can extend across months, or even years, particularly within less developed regions possessing limited resources.</p>\n<p>International cooperation has <span class=\"bonus\">increasingly been proving indispensable<span class=\"fn\">¹</span></span> to hurricane relief efforts, as nations furnish aid, supplies, and rescue personnel to affected communities. Nevertheless, the growing frequency and intensity of hurricanes — closely correlated with rising ocean temperatures — remains a matter of considerable concern for scientists worldwide.</p>\n<p>Hurricanes serve as a stark reminder of nature's raw, untamed force, and <span class=\"g-ger\">preparing communities to react with due swiftness</span> remains, by a considerable margin, the most effective means of mitigating their devastating impact.</p>\n<div class=\"footnotes\">1 — всё больше доказывает свою незаменимость</div>\n<div class=\"glegend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#e08b3f\"></span>Inversion (C1 marker)</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Perfect Participle Active</span>\n</div>\n<div class=\"refs\"><div class=\"refhead\">References</div>National Geographic (n.d.) <i>What Are Hurricanes and How Do They Form?</i> Available at: nationalgeographic.com/environment/article/hurricanes-typhoons-cyclones</div>\n<div class=\"wc\">≈ 250 words</div>", "wc": "≈ 250 words"}, {"topic": "Informal Email", "genre": "email", "level": "B2", "title": "Quick update from me!", "focus": "", "html": "<div class=\"block\">\n<div class=\"struct-tag st-1\">① Header</div>\n<div class=\"email-meta\">Subject: Quick update from me!</div>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-2\">② Greeting &amp; opening comment</div>\n<p>Hi Alex,<br/>Hope you're doing well! I just wanted to write and tell you what's been going on with me lately, since it's been a while since we last spoke.</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-3\">③ Body</div>\n<p>I'm still working at the same job, but it's getting busier. I don't have much free time these days, <span class=\"g-link\">especially</span> during the week. In the evenings, I usually study English — I'm trying to get better before my exams next month. It's hard sometimes, but I'm really enjoying the progress I'm making. My teacher says my writing has improved a lot.</p>\n<p>On weekends, I like to relax and read. I <span class=\"g-link\">also</span> started a new hobby recently: I'm learning to bake bread! My first loaf was terrible, and it was almost like a rock, but the second one was actually pretty good. My family loved it, so now I bake every Sunday.</p>\n<p><span class=\"g-ppc\">I've <span class=\"g-link\">also</span> been trying</span> to exercise more. I go for a walk every morning before work, which helps me feel more awake and less stressed. It's a small change, but it's made a big difference to my mood.</p>\n<p>Anyway, how's everything with you? Are you still going to the gym every day? Have you started that new project you mentioned last time? Let me know what you've been up to, and send some photos if you can!</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-4\">④ Ending</div>\n<p>Write soon!<br/>Best wishes,<br/>Kate</p>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Structure (as in your book, p.258)</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Header</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Greeting &amp; opening</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#c98a2c\"></span>Body</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#9b59b6\"></span>Ending</span>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Linking words used (teacher's sheet)</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#2a9d8f\"></span>also — To amplify (×2)</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#2a9d8f\"></span>especially — To introduce detail</span>\n</div>\n<div class=\"wc\">≈ 223 words</div>", "wc": "≈ 223 words"}, {"topic": "Informal Email", "genre": "email", "level": "B2+", "title": "Catching up after a while!", "focus": "", "html": "<div class=\"whylevel\"><b>What makes this B2+, not B2</b>\n<ul>\n<li>Natural filler phrases: <i>I've been meaning to write for ages</i> — sounds like real spoken English</li>\n<li>Idiomatic verbs: <i>juggling responsibility, switch off, getting the hang of it</i> — informal B2+/C1 shows through idiom, not formality</li>\n<li>Longer, more connected sentences, but contractions stay — informal register never drops them, even at higher levels</li>\n</ul>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-1\">① Header</div>\n<div class=\"email-meta\">Subject: Catching up after a while!</div>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-2\">② Greeting &amp; opening comment</div>\n<p>Hi Alex,<br/>I hope everything's going well with you! I've been meaning to write for ages, so I thought I'd finally sit down and give you a proper update, since so much has happened since we last spoke.</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-3\">③ Body</div>\n<p>Work's been pretty hectic lately — I'm <span class=\"bonus\">juggling a lot more responsibility<span class=\"fn\">¹</span></span> than before, which doesn't leave much free time, <span class=\"g-link\">especially</span> during the week. Most evenings, I try to squeeze in some English practice, since my exams are getting closer. It's definitely challenging, but I'm actually enjoying the progress I'm making, and my teacher's noticed a real improvement in my writing too.</p>\n<p>At weekends, I try to <span class=\"bonus\">switch off completely<span class=\"fn\">²</span></span>. I've picked up a new hobby too — baking bread, believe it or not! My first attempt was a disaster, practically inedible, but <span class=\"g-ppc\">I've slowly been</span> <span class=\"bonus\">getting the hang of it<span class=\"fn\">³</span></span>, and now I bake a loaf every single Sunday.</p>\n<p>I've <span class=\"g-link\">also</span> started <span class=\"g-ger\">making more of an effort</span> to stay active. I go for a walk every morning before work, and it's honestly made a huge difference — I feel far more awake and much less stressed throughout the day.</p>\n<p>Anyway, that's enough about me — how have you been? Are you still sticking to your gym routine? Did you end up <span class=\"g-ger\">starting that project</span> you mentioned last time we spoke? I'd love to hear what you've been up to, so do send some photos if you get the chance!</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-4\">④ Ending</div>\n<p>Looking forward to hearing from you!<br/>All the best,<br/>Kate</p>\n</div>\n<div class=\"footnotes\">1 — совмещаю больше обязанностей     2 — полностью отключиться от дел     3 — начинаю понимать, как это делать</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Structure</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Header</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Greeting &amp; opening</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#c98a2c\"></span>Body</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#9b59b6\"></span>Ending</span>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Linking words used (teacher's sheet)</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#2a9d8f\"></span>also — To amplify</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#2a9d8f\"></span>especially — To introduce detail</span>\n</div>\n<div class=\"wc\">≈ 248 words</div>", "wc": "≈ 248 words"}, {"topic": "Informal Email", "genre": "email", "level": "C1", "title": "Long overdue update!", "focus": "", "html": "<div class=\"whylevel\"><b>What makes this C1, not B2+ — different rules for informal writing!</b>\n<ul>\n<li>Unlike academic C1 (no inversion, no nominalisation here) — informal C1 shows through richer native-like idiom: <i>drop you a line, breathing room, borderline inedible, getting the knack of it</i></li>\n<li>Natural intensifiers: <i>undeniably demanding, genuinely satisfying, honestly not bad</i> — hedging natives actually use in speech</li>\n<li>Casual asides: <i>of all things, believe it or not</i> — signal effortless, confident informal style</li>\n<li>Still fully informal: contractions, short asides, casual sign-off — C1 here is about naturalness, not formality</li>\n</ul>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-1\">① Header</div>\n<div class=\"email-meta\">Subject: Long overdue update!</div>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-2\">② Greeting &amp; opening comment</div>\n<p>Hi Alex,<br/>I hope this finds you well! <span class=\"g-ppc\">I've been meaning</span> to <span class=\"bonus\">drop you a line<span class=\"fn\">¹</span></span> for weeks now, so I'm finally taking a moment to fill you in on what's been happening, given just how much has changed since we last spoke.</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-3\">③ Body</div>\n<p>Work has been fairly relentless lately — I've taken on considerably more responsibility than before, which hasn't left me with much <span class=\"bonus\">breathing room<span class=\"fn\">²</span></span>, <span class=\"g-link\">particularly</span> during the week. Most evenings, I try to carve out time for English practice, given how close my exams are creeping. It's undeniably demanding, but there's something genuinely satisfying about watching the progress add up, and even my teacher's remarked on how much my writing has come on.</p>\n<p>Weekends have become my one chance to properly unwind. I've <span class=\"g-link\">also</span> taken up an unlikely new hobby — bread-making, of all things! My first attempt was <span class=\"bonus\">borderline inedible<span class=\"fn\">³</span></span>, but <span class=\"g-ppc\">I've gradually been getting</span> the knack of it, and these days I bake a loaf religiously every Sunday.</p>\n<p><span class=\"g-ppc\">I've <span class=\"g-link\">also</span> been making</span> more of an effort to stay active, believe it or not. I go for a walk every morning before work, and it's honestly transformed how I feel — far more awake, and noticeably less stressed as the day goes on.</p>\n<p>Anyway, enough about me — how have things been on your end? Are you still as committed to the gym as ever? Did that project you mentioned last time ever get off the ground? I'd genuinely love to hear how you've been getting on, so do send a few photos if you get a chance!</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-4\">④ Ending</div>\n<p>Looking forward to catching up properly soon!<br/>Take care,<br/>Kate</p>\n</div>\n<div class=\"footnotes\">1 — черкнуть пару строк     2 — свободного времени/пространства     3 — почти несъедобный</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Structure</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Header</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Greeting &amp; opening</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#c98a2c\"></span>Body</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#9b59b6\"></span>Ending</span>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d1a23a\"></span>Present Perfect Continuous Active (×3 — a genuine C1 pattern for casual life-updates)</span>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Linking words used (teacher's sheet)</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#2a9d8f\"></span>also — To amplify (×2)</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#2a9d8f\"></span>particularly — close to \"in particular\" (To introduce detail)</span>\n</div>\n<div class=\"wc\">≈ 271 words</div>", "wc": "≈ 271 words"}, {"topic": "Blog / Online Post", "genre": "blog", "level": "B2", "title": "Tips for learning a new language", "focus": "", "html": "<div class=\"block\">\n<div class=\"struct-tag st-1\">① Opening comment</div>\n<p>Hi everyone! My name's Elena, and I wanted to share my thoughts on learning a new language, since I know a lot of people here are studying too and might find this useful.</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-3\">② Main body</div>\n<p>I think the hardest part is <span class=\"g-ger\">speaking with confidence</span>. I used to feel embarrassed about making mistakes, but now I just try my best and keep going. Nobody has ever laughed at me, so I think that fear was mostly in my head. Watching TV shows in the language really helped me a lot, especially with listening — I started with subtitles in my own language, then slowly switched to subtitles in the language I was learning.</p>\n<p>I also think <span class=\"g-ger\">practising a little every day</span> is better than <span class=\"g-ger\">studying for hours once a week</span>. Even 20 minutes can make a difference if you do it regularly. I use an app every morning before breakfast, and it's become part of my normal routine now, so I don't even have to think about it.</p>\n<p><span class=\"g-ger\">Reading</span> also helped me a lot. I started with children's books because the vocabulary was simple, and slowly moved on to harder texts. It felt slow at first, but I could see real progress after just a few months.</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-4\">③ Ending</div>\n<p>Thanks for reading! I'd love to hear what methods have worked for you, especially if you've found a good way to practise speaking. Good luck with your studies, everyone!</p>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Structure (as in your book, p.260)</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Opening comment</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#c98a2c\"></span>Main body</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#9b59b6\"></span>Ending</span>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n</div>\n<div class=\"wc\">≈ 233 words</div>", "wc": "≈ 233 words"}, {"topic": "Blog / Online Post", "genre": "blog", "level": "B2+", "title": "Tips for learning a new language", "focus": "", "html": "<div class=\"whylevel\"><b>What makes this B2+, not B2</b>\n<ul>\n<li>Softer, conversational framing instead of blunt statements</li>\n<li>Precision adverbs: <i>genuinely, particularly, consistently</i> replace plain \"really\" and \"a lot\"</li>\n<li>\"Tends to be far more effective\" — hedged comparison instead of a flat claim</li>\n</ul>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-1\">① Opening comment</div>\n<p>Hi everyone! I'm Elena, and I wanted to share a few thoughts on language learning, since this seems to be something many of us are working on at the moment, and I thought a few tips might be useful.</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-3\">② Main body</div>\n<p>In my experience, the most difficult part is actually <span class=\"g-ger\">speaking with any real confidence</span>. I used to feel quite embarrassed about making mistakes in front of others, but I've gradually learned to just <span class=\"bonus\">push through it<span class=\"fn\">¹</span></span> and <span class=\"g-ger\">keep practising</span> anyway — nobody has ever actually laughed at me, so I suspect that fear existed mostly in my own head. Watching TV shows in the target language has genuinely made a huge difference, particularly when it comes to listening skills; I started with subtitles in my native language, then slowly switched over once I felt more confident.</p>\n<p>I've also found that <span class=\"g-ger\">practising a little every single day</span> tends to be far more effective than <span class=\"g-ger\">cramming for hours once a week</span>. Even just twenty minutes, done consistently, can add up to real progress over time. I use an app every morning before breakfast now, and it's simply become part of my routine.</p>\n<p><span class=\"g-ger\">Reading</span> has helped enormously too. I started with children's books, since the vocabulary was manageable, and gradually worked my way up to more challenging texts. Progress felt slow to begin with, but it became noticeably clearer after just a few months.</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-4\">③ Ending</div>\n<p>Thanks so much for reading! I'd be really curious to hear what's worked well for you, particularly if you've found an effective way to practise speaking. Good luck with your studies, everyone!</p>\n</div>\n<div class=\"footnotes\">1 — преодолевать это, не сдаваться</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Structure</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Opening comment</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#c98a2c\"></span>Main body</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#9b59b6\"></span>Ending</span>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active (×5 — this topic naturally produces lots of them: speaking, practising, cramming, reading)</span>\n</div>\n<div class=\"wc\">≈ 262 words</div>", "wc": "≈ 262 words"}, {"topic": "Blog / Online Post", "genre": "blog", "level": "C1", "title": "Tips for learning a new language", "focus": "", "html": "<div class=\"whylevel\"><b>What makes this C1, not B2+</b>\n<ul>\n<li>Idiomatic richness again, not formality: <i>grappling with, cringe at the thought, trump intensity, done religiously</i></li>\n<li>\"If I'm honest\" — a natural conversational hedge that native speakers use to sound genuine, not academic</li>\n<li>Rhetorical contrast: <i>consistency really does seem to trump intensity</i> — confident, idiomatic claim-making</li>\n</ul>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-1\">① Opening comment</div>\n<p>Hi everyone! I'm Elena, and I thought I'd share a few thoughts on language learning, since it seems to be something quite a few of us are <span class=\"bonus\">grappling with<span class=\"fn\">¹</span></span> at the moment, and a few tips might come in handy.</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-3\">② Main body</div>\n<p>If I'm honest, the toughest part has always been <span class=\"g-ger\">speaking with any genuine confidence</span>. I used to <span class=\"bonus\">cringe at the thought<span class=\"fn\">²</span></span> of making mistakes in front of others, but I've slowly learned to just push through the discomfort and keep at it regardless — nobody has ever actually laughed at me, so that fear, in hindsight, existed almost entirely in my own head. Watching TV shows in the target language has made a genuinely noticeable difference, especially where listening skills are concerned; I started out relying on subtitles in my native language, then gradually weaned myself off them as my confidence grew.</p>\n<p>I've also come to realise that a little practice every single day tends to go a lot further than <span class=\"g-ger\">cramming for hours once a week</span> — consistency really does seem to <span class=\"bonus\">trump intensity<span class=\"fn\">³</span></span> here. Even twenty minutes, done religiously, can add up to real, tangible progress over time. These days, I run through an app every morning before breakfast, almost without thinking about it.</p>\n<p><span class=\"g-ger\">Reading</span> has made an enormous difference too. I started with children's books, given how manageable the vocabulary was, and gradually worked my way up to considerably more demanding texts. Progress felt painfully slow at first, but it became unmistakably clear after just a few months.</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-4\">③ Ending</div>\n<p>Thanks so much for reading! I'd love to hear what's actually worked for you all, particularly if you've cracked an effective way to practise speaking. Good luck with everything, and happy studying!</p>\n</div>\n<div class=\"footnotes\">1 — борется с, пытается справиться     2 — вздрагивать при одной мысли     3 — превосходит по значимости</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Structure</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Opening comment</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#c98a2c\"></span>Main body</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#9b59b6\"></span>Ending</span>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n</div>\n<div class=\"wc\">≈ 283 words</div>", "wc": "≈ 283 words"}, {"topic": "Formal Letter", "genre": "letter", "level": "B2", "title": "Letter of complaint", "focus": "", "html": "<div class=\"block\">\n<div class=\"struct-tag st-1\">① Salutation</div>\n<p>Dear Sir or Madam,</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-2\">② Opening — state the purpose</div>\n<p>I am writing to complain about an order I received from your company last week, order number 4521.</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-3\">③ Body — explanation &amp; details</div>\n<p><span class=\"g-link\">Firstly</span>, the parcel arrived five days later than the date promised on your website. <span class=\"g-link\">Secondly</span>, when I opened the box, I found that the item <span class=\"g-pass\">was damaged</span>. The screen of the tablet I ordered was cracked, and it did not turn on at all.</p>\n<p>I contacted your customer service team by email three days ago, but I have not received a reply. <span class=\"g-link\">Therefore</span>, I am writing to you directly to explain the situation and ask for help.</p>\n<p>In my opinion, the product <span class=\"g-pass\">was not packed</span> carefully enough. <span class=\"g-link\">As a result</span>, it was probably damaged during delivery. <span class=\"g-link\">Moreover</span>, the delay meant that I could not give it as a birthday present, as I had originally planned.</p>\n<p>I have ordered from your company several times before, and I have always been happy with the service. <span class=\"g-link\">However</span>, this experience has been very disappointing, and it has made me question whether I will order from you again.</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-4\">④ Closing — desired outcome</div>\n<p>For these reasons, I would like a full refund, or a replacement item sent as quickly as possible. I would also appreciate an explanation for both the delay and the damage.</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-5\">⑤ Sign-off</div>\n<p>I look forward to <span class=\"g-ger\">hearing from you</span> soon.<br/>Yours faithfully,<br/>J. Kowalski</p>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Structure</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Salutation</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Opening</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#c98a2c\"></span>Body</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#9b59b6\"></span>Closing</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#607d8b\"></span>Sign-off</span>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Passive Voice</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active (look forward to + -ing)</span>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Linking words used (teacher's sheet)</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#2a9d8f\"></span>Firstly / Secondly — order of time</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#2a9d8f\"></span>Therefore, As a result — effect</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#2a9d8f\"></span>Moreover — amplify</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#2a9d8f\"></span>However — contrast</span>\n</div>\n<div class=\"wc\">≈ 218 words</div>", "wc": "≈ 218 words"}, {"topic": "Formal Letter", "genre": "letter", "level": "B2+", "title": "Letter of complaint", "focus": "", "html": "<div class=\"whylevel\"><b>What makes this B2+, not B2</b>\n<ul>\n<li><span class=\"g-ger\">Upon opening the package</span> — gerund after \"upon\" is a classic formal-letter opener, more elevated than \"when I opened\"</li>\n<li>More precise verbs: <i>discovered, resolving, patronise</i> instead of everyday <i>found, fixing, use</i></li>\n<li>Two new connectors from the list appear: <i>Consequently, Furthermore</i> — formal register suits this genre perfectly, unlike in the informal email</li>\n<li>\"I would be grateful if...\" — a fixed polite formal request pattern</li>\n</ul>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-1\">① Salutation</div>\n<p>Dear Sir or Madam,</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-2\">② Opening — state the purpose</div>\n<p>I am writing to express my dissatisfaction with an order I recently received from your company, order number 4521.</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-3\">③ Body — explanation &amp; details</div>\n<p><span class=\"g-link\">Firstly</span>, the parcel arrived a full five days later than the delivery date originally promised on your website. <span class=\"g-link\">Secondly</span>, <span class=\"g-ger\">upon opening the package</span>, I discovered that the item itself <span class=\"g-pass\">was damaged</span> — the screen of the tablet I had ordered was cracked, and the device would not switch on at all.</p>\n<p>I contacted your customer service department by email three days ago, but I have not yet received any response. <span class=\"g-link\">Consequently</span>, I have decided to write to you directly in the hope of resolving this matter more quickly.</p>\n<p>In my view, the product <span class=\"g-pass\">was not packaged</span> with sufficient care, and this, as a result, most likely caused the damage during transit. <span class=\"g-link\">Furthermore</span>, the delay meant that I was unable to give the item as a birthday present, as I had originally intended.</p>\n<p>I have ordered from your company on several previous occasions and have generally been satisfied with the service provided. On this occasion, <span class=\"g-link\">however</span>, my experience has been genuinely disappointing, and it has led me to reconsider whether I will continue to shop with you in future.</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-4\">④ Closing — desired outcome</div>\n<p>For these reasons, I would be grateful if you could arrange either a full refund or a prompt replacement. <span class=\"g-link\">In addition</span>, I would appreciate a clear explanation for both the delay and the damage to the item.</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-5\">⑤ Sign-off</div>\n<p>I look forward to <span class=\"g-ger\">receiving your response</span> at your earliest convenience.<br/>Yours faithfully,<br/>J. Kowalski</p>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Structure</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Salutation</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Opening</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#c98a2c\"></span>Body</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#9b59b6\"></span>Closing</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#607d8b\"></span>Sign-off</span>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Passive Voice</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Linking words used (teacher's sheet)</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#2a9d8f\"></span>Firstly / Secondly — order of time</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#2a9d8f\"></span>Consequently — effect</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#2a9d8f\"></span>Furthermore, In addition — amplify</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#2a9d8f\"></span>However — contrast</span>\n</div>\n<div class=\"wc\">≈ 253 words</div>", "wc": "≈ 253 words"}, {"topic": "Formal Letter", "genre": "letter", "level": "C1", "title": "Letter of complaint", "focus": "", "html": "<div class=\"whylevel\"><b>What makes this C1, not B2+</b>\n<ul>\n<li><span class=\"g-inv\">Not only... but also</span> — inversion IS natural in formal letters (unlike academic \"Rarely is/does\"), used here to combine two complaints into one emphatic sentence</li>\n<li>\"I would be obliged if...\" — a more formal step up from \"I would be grateful if...\"</li>\n<li>Nominal precision: <i>sustained damage, in all likelihood, patronise</i> instead of everyday equivalents</li>\n<li>Semicolon joins two closely related formal clauses instead of a full stop</li>\n</ul>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-1\">① Salutation</div>\n<p>Dear Sir or Madam,</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-2\">② Opening — state the purpose</div>\n<p>I am writing to express my considerable dissatisfaction with an order recently received from your company, reference number 4521.</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-3\">③ Body — explanation &amp; details</div>\n<p><span class=\"g-inv\">Not only did the parcel arrive a full five days beyond the promised delivery date, but the item itself also proved to be damaged</span> upon arrival — the screen of the tablet in question was cracked, and the device failed to power on altogether.</p>\n<p>I contacted your customer service department by email three days ago; <span class=\"g-link\">however</span>, I have yet to receive any response whatsoever. <span class=\"g-link\">Consequently</span>, I have taken the decision to write to you directly in the hope of resolving this matter without further delay.</p>\n<p>It appears the product <span class=\"g-pass\">was not packaged</span> with adequate care, and this, in all likelihood, resulted in the damage sustained during transit. <span class=\"g-link\">Furthermore</span>, the delay meant I was regrettably unable to present the item as a birthday gift, as had originally been intended.</p>\n<p>I have ordered from your company on numerous previous occasions and have, on the whole, been satisfied with the standard of service provided. On this occasion, nonetheless, my experience has proven genuinely disappointing, prompting me to reconsider whether I shall continue to patronise your company in future.</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-4\">④ Closing — desired outcome</div>\n<p>For these reasons, I would be obliged if you could arrange either a full refund or a prompt replacement at your earliest convenience. <span class=\"g-link\">In addition</span>, I would appreciate a comprehensive explanation regarding both the delay and the damage sustained.</p>\n</div>\n<div class=\"block\">\n<div class=\"struct-tag st-5\">⑤ Sign-off</div>\n<p>I look forward to <span class=\"g-ger\">receiving your response</span> in due course.<br/>Yours faithfully,<br/>J. Kowalski</p>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Structure</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Salutation</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#4f9e78\"></span>Opening</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#c98a2c\"></span>Body</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#9b59b6\"></span>Closing</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#607d8b\"></span>Sign-off</span>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Grammar in this version</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#e08b3f\"></span>Inversion (genre-appropriate: Not only...but also)</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#d6708a\"></span>Passive Voice</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#3b7bbf\"></span>Gerund Active</span>\n</div>\n<div class=\"struct-legend\">\n<div class=\"ghead\">Linking words used (teacher's sheet)</div>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#2a9d8f\"></span>However — contrast</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#2a9d8f\"></span>Consequently — effect</span>\n<span class=\"gitem\"><span class=\"gdot\" style=\"background:#2a9d8f\"></span>Furthermore, In addition — amplify</span>\n</div>\n<div class=\"wc\">≈ 251 words</div>", "wc": "≈ 251 words"}];
</script>
<script>
const QUIZ_BANK = [
{q:"What three things must a good topic sentence have?",opts:["A subject, a verb, and a controlling idea","A hook, a fact, and a citation","An example, a statistic, and a quotation","A greeting, a body, and an ending"],a:0},
{q:"A good topic sentence is...",opts:["Too general, so it covers everything","Neither too general nor too specific","Always a question","Always the last sentence of the paragraph"],a:1},
{q:"Where is the topic sentence usually located?",opts:["In the middle of the paragraph","Usually the first sentence","Always the last sentence","It has no fixed position"],a:1},
{q:"'Attendance and examinations in the university system are different in America and Europe.' — what's wrong with this as a topic sentence?",opts:["It names the specific examples instead of staying general","It has no verb","It is too short","Nothing is wrong"],a:0},
{q:"In 'Spectacular beaches make Puerto Rico a tourist paradise,' what is the topic?",opts:["Spectacular beaches","Puerto Rico","Tourist paradise","Make"],a:1},
{q:"In 'A major problem of many students is the high cost of tuition,' what is the topic?",opts:["A major problem","Many students","The high cost","Tuition"],a:1},
{q:"What is the controlling idea?",opts:["The part of the topic sentence that states the writer's specific angle on the topic","The last word of the paragraph","A synonym for 'topic'","The title of the essay"],a:0},
{q:"Quick trick: to find controlling idea, you...",opts:["Remove the topic — what's left is the controlling idea","Remove the verb","Look only at adjectives","Look at the concluding sentence"],a:0},
{q:"Good supporting sentences should be...",opts:["General and vague","Specific and factual","As short as possible","Written in the passive voice only"],a:1},
{q:"What are the three kinds of specific supporting details mentioned in Oshima?",opts:["Examples, statistics, and quotations","Facts, opinions, and jokes","Titles, dates, and names","Intro, body, and conclusion"],a:0},
{q:"Which signal phrase typically introduces an EXAMPLE?",opts:["Consequently","For instance","In summary","As a result"],a:1},
{q:"Which signal phrase typically introduces a QUOTATION / cited source?",opts:["According to...","For example","Above all","Then"],a:0},
{q:"Which type of detail contains numbers/data, like '900 people die each year'?",opts:["Example","Statistic","Quotation","Concluding sentence"],a:1},
{q:"A good concluding sentence should...",opts:["Introduce a brand-new idea","Signal the end and summarize or restate the topic sentence","Repeat the whole paragraph word for word","Always start with 'In conclusion'"],a:1},
{q:"Why does Oshima warn against overusing 'in conclusion' and 'in summary'?",opts:["They are grammatically incorrect","Many writing teachers think they are overused","They only work in emails","They are too short"],a:1},
{q:"Which of these is NOT recommended as a concluding signal in Oshima's notes?",opts:["We can see that","The evidence suggests that","At last","There can be no doubt that"],a:2},
{q:"Why is 'at last' a poor paragraph-ending signal?",opts:["It's too formal","It means 'after a long period of time,' not 'in conclusion'","It's grammatically wrong","It's only used in questions"],a:1},
{q:"'Although some people think X, [main claim]' — where is the real topic sentence?",opts:["In the 'Although' part","In the part after the comma (the main claim)","There is no topic sentence","Both parts equally"],a:1},
{q:"What is the paragraph structure pattern in this kind of sentence called?",opts:["A concession followed by the writer's real claim","A question and answer","A list of examples","A direct quotation"],a:0},
{q:"'Choosing the movie genre depends on the mood.' What grammatical role does 'Choosing' play?",opts:["A main verb","A gerund acting as the subject","An adjective","A preposition"],a:1},
{q:"Can a sentence have two main verbs for one subject without a conjunction?",opts:["Yes, always","No — you need a separate verb after a gerund subject","Only in informal writing","Only in academic writing"],a:1},
{q:"'Movies embellish the love' vs 'The love in movies is too embellished' — which one keeps 'movies' as the topic?",opts:["'Movies embellish the love'","'The love in movies is too embellished'","Both equally","Neither"],a:0},
{q:"In a Process paragraph (like the volcano eruption text), what determines sentence order?",opts:["Alphabetical order","Chronological order — the sequence of steps","Random order","Order of importance only"],a:1},
{q:"Which signal word suggests a process paragraph's very FIRST step?",opts:["Then","First of all","Finally","Meanwhile"],a:1},
{q:"In a Comparison paragraph, what phrase pattern often repeats?",opts:["'In Europe... in the United States... in Europe...'","Random topic changes","Only questions","Only statistics"],a:0},
{q:"What is the Present Perfect Continuous form?",opts:["have/has been + verb-ing","am/is/are + verb-ing","have/has + past participle","had been + past participle"],a:0},
{q:"'I've been meaning to write for ages' uses which structure?",opts:["Present Simple Passive","Present Perfect Continuous Active","Perfect Participle","Inversion"],a:1},
{q:"What is a Perfect Participle (active) example?",opts:["Having spread across thousands of hectares...","Being spread across...","Was spread across...","Spreading across..."],a:0},
{q:"What is a Perfect Participle (passive) example?",opts:["Having erupted, a volcano...","Having been weakened by rain, a snow layer...","Erupting violently...","Weakened by rain..."],a:1},
{q:"'The item was damaged' is an example of...",opts:["Present Simple Passive","Past Simple Passive","Present Perfect Active","Gerund"],a:1},
{q:"'Preventing wildfires requires cooperation' — what grammar point is 'Preventing'?",opts:["Present participle used as adjective","Gerund acting as the subject","Passive voice","Infinitive"],a:1},
{q:"What is academic-essay inversion, e.g. 'Rarely is the true scale of flood risk appreciated'?",opts:["A normal statement","A negative/limiting adverb fronted, causing subject-auxiliary inversion","A question","A passive sentence"],a:1},
{q:"Is inversion like 'Rarely is/does...' natural in an informal email to a friend?",opts:["Yes, always use it for a high score","No — it sounds academic and mismatched in casual writing","Only in the ending","Only if the email is about school"],a:1},
{q:"In informal writing, C1 level is best shown through...",opts:["Inversion and nominalisation","Rich, natural idioms and native-like phrasing","Long sentences only","Using 'moreover' often"],a:1},
{q:"Which idiom fits an informal C1 email about being busy?",opts:["Consequently, I have been occupied","I haven't had much breathing room lately","It is apparent that I am busy","Utilising my time has proven difficult"],a:1},
{q:"'Not only did the parcel arrive late, but the item was also damaged' — what device is this?",opts:["Academic inversion (Rarely is/does)","A natural inversion pattern common in formal complaint letters","A grammar mistake","Informal idiom"],a:1},
{q:"What is the correct structure after 'look forward to'?",opts:["look forward to + infinitive (to do)","look forward to + gerund (-ing)","look forward to + base verb","look forward to + past tense"],a:1},
{q:"What is the structure of a Formal Letter, in order?",opts:["Salutation, Opening, Body, Closing, Sign-off","Hi, Body, Bye","Title, Body, Ending","Header, Greeting, Body, Ending"],a:0},
{q:"What is the structure of an Informal Email, in order?",opts:["Salutation, Opening, Body, Closing, Sign-off","Header, Greeting & opening comment, Body, Ending","Opening comment, Main body, Ending","Introduction, Argument, Conclusion"],a:1},
{q:"What is the structure of a Blog / Online Post, in order?",opts:["Header, Greeting, Body, Ending","Salutation, Opening, Body, Closing","Opening comment, Main body, Ending","Hook, Thesis, Body, Conclusion"],a:2},
{q:"Which sign-off fits a Formal Letter addressed 'Dear Sir or Madam'?",opts:["Yours faithfully","Best wishes","Take care","Cheers"],a:0},
{q:"Does a formal letter usually use contractions like 'I've' or 'don't'?",opts:["Yes, always","No — formal writing avoids contractions","Only in the closing","Only if writing to a friend"],a:1},
{q:"Does an informal email usually avoid contractions?",opts:["Yes, always avoid them","No — contractions are natural and expected in informal writing","Only in the header","Only in C1 level"],a:1},
{q:"'Firstly... Secondly...' in a formal complaint letter are examples of which linking category?",opts:["Signal an example","Signal order of time/sequence","Signal a contrast","Signal similarity"],a:1},
{q:"'Consequently' and 'As a result' belong to which linking category?",opts:["Signal an effect","Signal an example","Signal emphasis","Signal similarity"],a:0},
{q:"'Furthermore' and 'Moreover' belong to which linking category?",opts:["Signal a contrast","To amplify / add a point","Signal a conclusion","Signal an example"],a:1},
{q:"'However' and 'Nevertheless' belong to which linking category?",opts:["To offer a contrast","To express causality","To generalise","To introduce detail"],a:0},
{q:"'Especially' and 'In particular' belong to which linking category?",opts:["To introduce detail","To conclude","To show similarity","To express causality"],a:0},
{q:"Why might it look odd to use 'consequently' or 'moreover' in a casual text to a friend?",opts:["They are spelled incorrectly","They belong to a formal/academic register, mismatched with a casual genre","They are too short","They can't start a sentence"],a:1},
{q:"'Present Continuous vs Present Simple' — which do you use for a routine/habit?",opts:["Present Continuous","Present Simple","Both equally","Neither, use Past Simple"],a:1},
{q:"Which do you use for an action happening right now, at the moment of speaking?",opts:["Present Continuous","Present Simple","Present Perfect","Past Continuous"],a:0},
{q:"'I am cooking dinner right now' — why Continuous, not Simple?",opts:["Because it's happening at this exact moment","Because it's a general truth","Because it's a habit","Because it's a finished action"],a:0},
