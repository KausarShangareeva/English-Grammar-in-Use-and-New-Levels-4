<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kausar · study hub</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMyNzZCN0EiLz48cGF0aCBkPSJNMTIgNDZWMThoNS42djIzLjJIMzB2NC44eiIgZmlsbD0iI0ZBRjdGMiIvPjxwYXRoIGQ9Ik01MiAzOS40aC00LjRWNDZoLTUuM3YtNi42SDMwLjV2LTQuMkw0Mi4zIDE4aDV2MTcuM0g1MnpNMzYuNiAzNS4zaDUuN1YyNnoiIGZpbGw9IiNFOEI0QkMiLz48L3N2Zz4=">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#EAF0EC">
<style>
:root{
  --bg:#EAF0EC; --panel:#FFFFFF; --card:#FFFFFF;
  --line:#DCE6DF; --line2:#CBDACF;
  --ink:#2B3D44; --mut:#6B7F86; --mut2:#9AAAB0;
  --sea:#276B7A; --sea-l:#E4EFF1;
  --rose:#C98A9B; --rose-l:#F8EDF0;
  --sand:#C9A227; --sand-l:#F7F0DC;
  --sage:#4F8A6B; --sage-l:#E9F2EC;
  --disp:"Cormorant Garamond",Georgia,serif;
  --ui:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --rad:20px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);font-family:var(--ui);color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow:hidden}

.shell{display:flex;height:100vh;height:100dvh;padding:14px;gap:14px}

/* ---------------- sidebar ---------------- */
.side{width:224px;flex:0 0 224px;background:var(--panel);border-radius:var(--rad);
  padding:20px 14px;display:flex;flex-direction:column;box-shadow:0 6px 22px rgba(39,107,122,.06)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 20px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--sea);color:#fff;
  display:grid;place-items:center;font-family:var(--disp);font-size:17px;font-weight:700;flex:0 0 34px}
.brand .mark em{font-style:normal;color:var(--rose)}
.brand .bt{font-family:var(--disp);font-size:19px;font-weight:600;line-height:1.15}
.brand .bs{font-family:var(--ui);font-size:10px;color:var(--mut2);letter-spacing:.6px;text-transform:uppercase}

.navlab{font-size:9.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--mut2);padding:0 8px;margin:6px 0 8px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:none;background:none;
  padding:11px 12px;border-radius:13px;font-family:var(--ui);font-size:14px;font-weight:700;
  color:var(--mut);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nav button .ic{width:20px;height:20px;flex:0 0 20px;display:grid;place-items:center;font-size:15px}
.nav button:hover{background:var(--sea-l);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--sage-l);color:var(--ink)}
.nav button[aria-current="true"] .ic{filter:none}
.nav button .n{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--mut2)}
.nav button.soon{opacity:.5;cursor:default}
.nav button.soon:hover{background:none;color:var(--mut)}

.sidefoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.sidefoot .who{display:flex;align-items:center;gap:10px;padding:8px 8px 4px}
.sidefoot .av{width:30px;height:30px;border-radius:50%;background:var(--rose-l);color:var(--rose);
  display:grid;place-items:center;font-family:var(--disp);font-size:15px;font-weight:700;flex:0 0 30px}
.sidefoot .nm{font-size:13px;font-weight:800}
.sidefoot .sub{font-size:10.5px;color:var(--mut2)}
.sidefoot a{display:block;font-size:11px;color:var(--mut2);text-decoration:none;padding:8px 8px 0}
.sidefoot a:hover{color:var(--sea)}

/* ---------------- main ---------------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:14px;padding:2px 4px}
.hello{font-family:var(--disp);font-size:24px;font-weight:600;line-height:1.15}
.hello span{color:var(--sea)}
.tagline{font-size:12px;color:var(--mut);margin-top:2px}
.top .spacer{margin-left:auto}
.pill{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--mut)}
.pill b{color:var(--ink)}
.openraw{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 13px;
  font-family:var(--ui);font-size:12px;font-weight:700;color:var(--mut);cursor:pointer;text-decoration:none}
.openraw:hover{color:var(--sea);border-color:var(--line2)}

.frame{flex:1;min-height:0;background:var(--panel);border-radius:var(--rad);overflow:hidden;
  box-shadow:0 6px 22px rgba(39,107,122,.06);position:relative}
.frame iframe{width:100%;height:100%;border:0;display:block;background:var(--panel)}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--panel);
  font-size:13px;color:var(--mut2);transition:opacity .25s}
.loading.gone{opacity:0;pointer-events:none}

/* ---------------- phones ---------------- */
.mobbar{display:none}
@media (max-width:820px){
  body{overflow:auto}
  .shell{flex-direction:column;padding:0;gap:0;height:auto;min-height:100dvh}
  .side{display:none}
  .main{padding:12px 12px 0;gap:10px}
  .top{flex-wrap:wrap;gap:8px}
  .hello{font-size:21px}
  .frame{border-radius:16px;height:calc(100dvh - 168px);flex:none}
  .mobbar{display:flex;position:sticky;bottom:0;z-index:5;gap:6px;padding:8px 10px 12px;
    background:linear-gradient(to top,var(--bg) 72%,transparent);overflow-x:auto}
  .mobbar button{flex:1 0 auto;min-width:88px;border:1px solid var(--line);background:var(--panel);
    border-radius:14px;padding:9px 10px;font-family:var(--ui);font-size:11.5px;font-weight:800;
    color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;
    -webkit-tap-highlight-color:transparent}
  .mobbar button .ic{font-size:16px}
  .mobbar button[aria-current="true"]{background:var(--sage-l);color:var(--ink);border-color:#CFE3D6}
  .mobbar button.soon{opacity:.5}
}
</style>
</head>
<body>
<div class="shell">

  <aside class="side">
    <div class="brand">
      <span class="mark">L<em>4</em></span>
      <span>
        <span class="bt">Study hub</span>
        <span class="bs">Kausar</span>
      </span>
    </div>

    <div class="navlab">Learning</div>
    <nav class="nav" id="nav"></nav>

    <div class="sidefoot">
      <div class="who">
        <span class="av">K</span>
        <span>
          <div class="nm">Kausar</div>
          <div class="sub" id="goal"></div>
        </span>
      </div>
      <a href="https://github.com/KausarShangareeva" target="_blank" rel="noopener">Repositories &rsaquo;</a>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <div>
        <div class="hello" id="hello"></div>
        <div class="tagline" id="tagline"></div>
      </div>
      <div class="spacer"></div>
      <div class="pill" id="datepill"></div>
      <a class="openraw" id="openraw" target="_blank" rel="noopener">Open on its own &nearr;</a>
    </div>

    <div class="frame">
      <div class="loading" id="loading">loading…</div>
      <iframe id="view" title="Study app" src="about:blank"></iframe>
    </div>

    <nav class="mobbar" id="mobbar"></nav>
  </main>
</div>

<script>
"use strict";
const APPS = [
  { id:'words',  icon:'📗', label:'Words & grammar', file:'trainer.html',
    tagline:'Vocabulary, grammar and reading — New Levels 4 and twelve books.' },
  { id:'oshima', icon:'✍️', label:'Essay writing',   file:'oshima.html',
    tagline:'Oshima & Hogue — essays, paragraph structure and the daily quiz.' },
  { id:'third',  icon:'🕌', label:'Third app',       file:null,
    tagline:'Send me the link and it will live here too.' }
];

const $ = s => document.querySelector(s);
const KEY = 'studyhub_last';

function greeting(){
  const h = new Date().getHours();
  return h < 5 ? 'Still awake' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}

function paintChrome(){
  $('#hello').innerHTML = greeting() + ', <span>Kausar</span>';
  const d = new Date();
  $('#datepill').innerHTML = d.toLocaleDateString('en-GB',
    { weekday:'long', day:'numeric', month:'long' });
  const target = new Date('2027-04-15T00:00:00');
  const days = Math.max(0, Math.round((target - d) / 86400000));
  $('#goal').textContent = days + ' days to the SU deadline';
}

function button(a, forMobile){
  const b = document.createElement('button');
  b.className = a.file ? '' : 'soon';
  b.innerHTML = forMobile
    ? `<span class="ic">${a.icon}</span>${a.label.split(' ')[0]}`
    : `<span class="ic">${a.icon}</span>${a.label}` + (a.file ? '' : '<span class="n">soon</span>');
  b.onclick = () => open(a.id);
  b.dataset.id = a.id;
  return b;
}

function paintNav(){
  const nav = $('#nav'), mob = $('#mobbar');
  nav.innerHTML = ''; mob.innerHTML = '';
  APPS.forEach(a => { nav.appendChild(button(a, false)); mob.appendChild(button(a, true)); });
}

let current = null;
function open(id){
  const a = APPS.find(x => x.id === id);
  if (!a) return;
  if (!a.file){
    $('#tagline').textContent = a.tagline;
    return;
  }
  if (current === id) return;
  current = id;
  document.querySelectorAll('#nav button, #mobbar button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.id === id));
  $('#tagline').textContent = a.tagline;
  $('#openraw').href = a.file;
  const load = $('#loading');
  load.classList.remove('gone');
  const v = $('#view');
  v.onload = () => load.classList.add('gone');
  v.src = a.file;
  try { localStorage.setItem(KEY, id); } catch(e){}
  /* Inside a sandboxed preview the page has no real address of its own,
     so touching the URL throws. The hub works either way. */
  try {
    if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  } catch(e){}
}

paintChrome();
paintNav();
setInterval(paintChrome, 60000);

let start = '';
try { start = location.hash.slice(1); } catch(e){}
if (!APPS.some(a => a.id === start && a.file)) {
  try { start = localStorage.getItem(KEY); } catch(e){ start = null; }
}
if (!APPS.some(a => a.id === start && a.file)) start = 'words';
open(start);

window.addEventListener('hashchange', () => {
  try { open(location.hash.slice(1)); } catch(e){}
});

/* If the apps cannot be reached — a sandboxed preview, or the files not
   uploaded yet — say so instead of showing an empty white panel. */
(function watchFrame(){
  const v = document.getElementById('view'), load = document.getElementById('loading');
  let done = false;
  v.addEventListener('load', () => { done = true; });
  setTimeout(() => {
    if (done) return;
    load.classList.remove('gone');
    load.innerHTML = '<div style="text-align:center;line-height:1.7;max-width:320px">' +
      '<b>The apps live next to this page.</b><br>' +
      'Open the hub from GitHub Pages, or open <b>trainer.html</b> and ' +
      '<b>oshima.html</b> directly — a preview window cannot reach them.</div>';
  }, 4000);
})();
</script>
</body>
</html>
