<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kausar · study hub</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMyNzZCN0EiLz48cGF0aCBkPSJNMTIgNDZWMThoNS42djIzLjJIMzB2NC44eiIgZmlsbD0iI0ZBRjdGMiIvPjxwYXRoIGQ9Ik01MiAzOS40aC00LjRWNDZoLTUuM3YtNi42SDMwLjV2LTQuMkw0Mi4zIDE4aDV2MTcuM0g1MnpNMzYuNiAzNS4zaDUuN1YyNnoiIGZpbGw9IiNFOEI0QkMiLz48L3N2Zz4=">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#E7EFE9">
<style>
:root{
  --bg:#E7EFE9; --panel:#FFFFFF;
  --line:#DFE8E2; --line2:#CBDACF;
  --ink:#2B3D44; --mut:#6B7F86; --mut2:#9AAAB0;
  --sea:#276B7A; --sea-l:#E4EFF1;
  --rose:#C98A9B; --rose-l:#F8EDF0;
  --sand:#C9A227; --sage:#4F8A6B; --sage-l:#E9F2EC;
  --disp:"Cormorant Garamond",Georgia,serif;
  --ui:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);font-family:var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased}
.shell{display:flex;min-height:100vh;min-height:100dvh;padding:14px;gap:14px}

.side{width:216px;flex:0 0 216px;background:var(--panel);border-radius:22px;padding:20px 13px;
  display:flex;flex-direction:column;position:sticky;top:14px;height:calc(100dvh - 28px);
  box-shadow:0 6px 22px rgba(39,107,122,.06)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 22px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--sea);color:#fff;
  display:grid;place-items:center;font-family:var(--disp);font-size:17px;font-weight:700;flex:0 0 34px}
.brand .mark em{font-style:normal;color:var(--rose)}
.brand .bt{font-family:var(--disp);font-size:19px;font-weight:600;line-height:1.1;display:block}
.brand .bs{font-size:9.5px;color:var(--mut2);letter-spacing:1px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:none;background:none;
  padding:11px 12px;border-radius:13px;font-family:var(--ui);font-size:13.5px;font-weight:700;
  color:var(--mut);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nav button .ic{width:18px;flex:0 0 18px;text-align:center;font-size:14px}
.nav button:hover{background:var(--sea-l);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--sage-l);color:var(--ink)}
.sidefoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.who{display:flex;align-items:center;gap:10px;padding:6px 8px 2px}
.av{width:30px;height:30px;border-radius:50%;background:var(--rose-l);color:var(--rose);
  display:grid;place-items:center;font-family:var(--disp);font-size:15px;font-weight:700;flex:0 0 30px}
.who .nm{font-size:13px;font-weight:800}
.who .sub{font-size:10.5px;color:var(--mut2)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:flex-start;gap:14px;padding:4px 4px 0}
.hello{font-family:var(--disp);font-size:26px;font-weight:600;line-height:1.1}
.hello span{color:var(--sea)}
.tagline{font-size:12.5px;color:var(--mut);margin-top:3px}
.top .spacer{margin-left:auto}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 15px;
  font-size:12px;font-weight:700;color:var(--mut);white-space:nowrap}

.dash{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.dash > :first-child{flex:1 1 460px;min-width:0}
.dash > :last-child{flex:0 1 300px}
@supports (display:grid){
  .dash{display:grid;grid-template-columns:1fr 300px}
}
@media (max-width:1080px){
  .dash{display:flex;flex-direction:column}
  @supports (display:grid){ .dash{display:grid;grid-template-columns:1fr} }
}
.sec{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut2);margin:2px 2px 10px}
.cards{display:flex;flex-wrap:wrap;gap:13px}
.cards > *{flex:1 1 196px;max-width:340px}
@supports (display:grid){
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}
  .cards > *{max-width:none}
}
.course{background:var(--panel);border:none;border-radius:19px;padding:0;overflow:hidden;text-align:left;
  cursor:pointer;display:flex;flex-direction:column;box-shadow:0 6px 20px rgba(39,107,122,.06);
  -webkit-tap-highlight-color:transparent;transition:transform .15s,box-shadow .15s}
.course:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(39,107,122,.12)}
.cover{height:150px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  padding:14px;color:#fff}
.cover .em{position:absolute;top:12px;right:13px;font-size:20px;opacity:.9}
.cover .ct{font-family:var(--disp);font-size:23px;font-weight:600;line-height:1.15}
.cover .cs{font-size:10.5px;opacity:.85;margin-top:3px}
.cbody{padding:12px 14px 14px}
.cbody .cd{font-size:12px;color:var(--mut);line-height:1.5;min-height:36px}
.bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:11px}
.bar i{display:block;height:100%;background:var(--sea);border-radius:99px}
.cstat{display:flex;gap:6px;margin-top:8px;font-size:11px;color:var(--mut2);font-weight:700}
.cstat b{color:var(--ink)}
.course.soon{opacity:.62;cursor:default}
.course.soon:hover{transform:none;box-shadow:0 6px 20px rgba(39,107,122,.06)}

.panelcard{background:var(--panel);border-radius:19px;padding:16px 16px 14px;
  box-shadow:0 6px 20px rgba(39,107,122,.06);margin-bottom:14px}
.panelcard h3{font-family:var(--disp);font-size:20px;font-weight:600;margin:0 0 3px}
.panelcard .ps{font-size:11.5px;color:var(--mut2);margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .dow{font-size:9px;font-weight:800;color:var(--mut2);padding-bottom:4px}
.cal .d{font-size:11.5px;padding:6px 0;border-radius:9px;color:var(--mut)}
.cal .d.out{color:#D6E0DA}
.cal .d.today{background:var(--sea);color:#fff;font-weight:800}
.rowline{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rowline:first-of-type{border-top:none}
.rowline .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.rowline .t1{font-size:12.5px;font-weight:700}
.rowline .t2{font-size:11px;color:var(--mut2)}
.rowline .rt{margin-left:auto;font-size:11px;font-weight:800;color:var(--mut2)}

.view{display:none;flex-direction:column;gap:10px;flex:1;min-height:0}
.view.on{display:flex}
.dash.off{display:none}
.viewbar{display:flex;align-items:center;gap:10px}
.back{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 15px;
  font-family:var(--ui);font-size:12.5px;font-weight:800;color:var(--mut);cursor:pointer}
.back:hover{color:var(--sea)}
.vtitle{font-family:var(--disp);font-size:21px;font-weight:600}
.viewbar .spacer{margin-left:auto}
.openraw{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 13px;
  font-family:var(--ui);font-size:12px;font-weight:700;color:var(--mut);text-decoration:none}
.frame{flex:1;min-height:520px;background:var(--panel);border-radius:19px;overflow:hidden;
  box-shadow:0 6px 20px rgba(39,107,122,.06);position:relative}
.frame iframe{width:100%;height:100%;border:0;display:block}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--panel);
  font-size:13px;color:var(--mut2);transition:opacity .3s;padding:24px;text-align:center;line-height:1.7}
.loading.gone{opacity:0;pointer-events:none}

.mobbar{display:none}
@media (max-width:860px){
  .shell{flex-direction:column;padding:0;gap:0}
  .side{display:none}
  .main{padding:12px 12px 0}
  .hello{font-size:22px}
  .cards{grid-template-columns:1fr 1fr;gap:10px}
  .cover{height:120px}
  .cover .ct{font-size:19px}
  .cbody .cd{display:none}
  .frame{min-height:calc(100dvh - 210px)}
  .mobbar{display:flex;position:sticky;bottom:0;z-index:5;gap:6px;padding:9px 10px 12px;
    background:linear-gradient(to top,var(--bg) 74%,transparent)}
  .mobbar button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:14px;
    padding:9px 6px;font-family:var(--ui);font-size:11px;font-weight:800;color:var(--mut);
    display:flex;flex-direction:column;align-items:center;gap:3px}
  .mobbar button[aria-current="true"]{background:var(--sage-l);color:var(--ink);border-color:#CFE3D6}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <span class="mark">L<em>4</em></span>
      <span><span class="bt">Study hub</span><span class="bs">Kausar</span></span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      <div class="who"><span class="av">K</span>
        <span><div class="nm">Kausar</div><div class="sub" id="goal"></div></span></div>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <div>
        <div class="hello" id="hello"></div>
        <div class="tagline" id="tagline">Welcome back — pick a course and carry on.</div>
      </div>
      <div class="spacer"></div>
      <div class="pill" id="datepill"></div>
    </div>

    <div class="dash" id="dash">
      <div>
        <div class="sec">Your courses</div>
        <div class="cards" id="cards"></div>
      </div>
      <div>
        <div class="panelcard">
          <h3 id="calTitle"></h3>
          <div class="ps" id="calSub"></div>
          <div class="cal" id="cal"></div>
        </div>
        <div class="panelcard">
          <h3>What is next</h3>
          <div class="ps">The dates that actually matter</div>
          <div id="sched"></div>
        </div>
      </div>
    </div>

    <div class="view" id="view">
      <div class="viewbar">
        <button class="back" id="back">&larr; All courses</button>
        <div class="vtitle" id="vtitle"></div>
        <div class="spacer"></div>
        <a class="openraw" id="openraw" target="_blank" rel="noopener">Open on its own &nearr;</a>
      </div>
      <div class="frame">
        <div class="loading" id="loading">loading&hellip;</div>
        <iframe id="fr" title="Course"></iframe>
      </div>
    </div>

    <nav class="mobbar" id="mobbar"></nav>
  </main>
</div>

<script>
"use strict";
const COURSES = [
  { id:'units', app:'words', emoji:'\uD83D\uDCD8',
    title:'Words from units', sub:'New Levels 4 \u00b7 13 sections',
    grad:'linear-gradient(140deg,#1E5A66 0%,#2F8A86 55%,#7FA98B 100%)',
    desc:'The course word lists, 1.1 to 4.3 and the Academic Word List.',
    go:"var r=document.querySelectorAll('#hub .hubrow'); r[0].click();" +
       "document.querySelectorAll('#bookchips .chip').forEach(function(c){" +
       "if(c.getAttribute('aria-pressed')==='true') c.click();});" },
  { id:'books', app:'words', emoji:'\uD83D\uDCDA',
    title:'Words from books', sub:'twelve books \u00b7 four series',
    grad:'linear-gradient(140deg,#5B3A6E 0%,#A8574F 55%,#C9A227 100%)',
    desc:'Everything you have read, from The 100 to Gatsby, with the idioms.',
    go:"var r=document.querySelectorAll('#hub .hubrow'); r[0].click();" +
       "document.querySelectorAll('#units .chip').forEach(function(c){" +
       "if(c.getAttribute('aria-pressed')==='true') c.click();});" },
  { id:'grammar', app:'words', emoji:'\uD83D\uDCD0',
    title:'Grammar', sub:'29 topics \u00b7 essay, speaking, rules',
    grad:'linear-gradient(140deg,#2B4A6B 0%,#4E7BA8 55%,#8FB0C4 100%)',
    desc:'Tenses, articles, linkers, the speaking sets and the quick rules.',
    go:"document.querySelectorAll('#hub .hubrow')[1].click();" },
  { id:'reading', app:'words', emoji:'\uD83D\uDCD6',
    title:'Reading', sub:'two series \u00b7 twelve episodes',
    grad:'linear-gradient(140deg,#7A3B2B 0%,#B4623F 55%,#D9A566 100%)',
    desc:'Stories written around the words of each unit; tap any word to see it.',
    go:"document.querySelectorAll('#hub .hubrow')[2].click();" },
  { id:'essay', app:'oshima', emoji:'\u270D\uFE0F',
    title:'Essay writing', sub:'Oshima & Hogue',
    grad:'linear-gradient(140deg,#7A3B5C 0%,#A85578 55%,#C98BA6 100%)',
    desc:'Thirty-six model essays, paragraph structure and the quiz gate.',
    go:null },
  { id:'third', app:null, emoji:'\uD83D\uDD4C',
    title:'Third course', sub:'waiting for its link',
    grad:'linear-gradient(140deg,#4A4A3E 0%,#8A6A38 55%,#C9A227 100%)',
    desc:'Send me the address and it will sit here with the others.',
    go:null }
];
const $ = s => document.querySelector(s);
const NAV = [{id:'dash',icon:'\u25A6',label:'Dashboard'}]
  .concat(COURSES.map(c => ({id:c.id, icon:c.emoji, label:c.title})));

function readJSON(k){ try{ const t=localStorage.getItem(k); return t?JSON.parse(t):null; }catch(e){ return null; } }
const UNIT_WORDS=966, BOOK_WORDS=1115, GRAM_TOPICS=29, EPISODES=12;
function stats(){
  const out = { units:{pct:0,line:'not started yet'}, books:{pct:0,line:'not started yet'},
    grammar:{pct:0,line:'not opened yet'}, reading:{pct:0,line:'not opened yet'},
    essay:{pct:0,line:'not started yet'}, third:{pct:0,line:'not added yet'} };
  const s = readJSON('nl4vocab_v1');
  if (s){
    if (s.stats){
      const learned = Object.values(s.stats).filter(x => (x.run||0) >= 3).length;
      out.units = { pct: Math.min(100, Math.round(learned/UNIT_WORDS*100)),
        line: learned + ' words mastered so far' };
      out.books = { pct: Math.min(100, Math.round(learned/BOOK_WORDS*100)),
        line: learned + ' words mastered so far' };
    }
    const seen = s.seen ? Object.keys(s.seen).length : 0;
    if (seen) out.grammar = { pct: Math.min(100, Math.round(seen/GRAM_TOPICS*100)),
      line: seen + ' of ' + GRAM_TOPICS + ' topics opened' };
    const ep = (s.visited||[]).length;
    if (ep) out.reading = { pct: Math.min(100, Math.round(ep/EPISODES*100)),
      line: ep + ' of ' + EPISODES + ' episodes unlocked' };
  }
  const read = readJSON('oshima_essays-read');
  if (read){
    const n = Array.isArray(read) ? read.length
      : Object.keys(read).filter(k => k !== 'savedAt').length;
    out.essay = { pct: Math.round(n/36*100), line: n + ' of 36 essays read' };
  }
  return out;
}
function greeting(){
  const h = new Date().getHours();
  return h < 5 ? 'Still awake' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}
function paintCards(){
  const st = stats(), box = $('#cards');
  box.innerHTML = '';
  COURSES.forEach(c => {
    const s = st[c.id];
    const b = document.createElement('button');
    b.className = 'course' + (c.app ? '' : ' soon');
    b.innerHTML =
      '<div class="cover" style="background:' + c.grad + '">' +
        '<span class="em">' + c.emoji + '</span>' +
        '<span class="ct">' + c.title + '</span><span class="cs">' + c.sub + '</span></div>' +
      '<div class="cbody"><div class="cd">' + c.desc + '</div>' +
        '<div class="bar"><i style="width:' + Math.max(2, s.pct) + '%"></i></div>' +
        '<div class="cstat"><b>' + s.pct + '%</b> \u00b7 ' + s.line + '</div></div>';
    b.onclick = () => go(c.id);
    box.appendChild(b);
  });
}
function paintCalendar(){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  $('#calTitle').textContent = now.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const start = (new Date(y,m,1).getDay() + 6) % 7, days = new Date(y,m+1,0).getDate();
  let html = ['M','T','W','T','F','S','S'].map(d => '<div class="dow">'+d+'</div>').join('');
  for (let i=0;i<start;i++) html += '<div class="d out"></div>';
  for (let d=1; d<=days; d++)
    html += '<div class="d' + (d===now.getDate() ? ' today' : '') + '">' + d + '</div>';
  $('#cal').innerHTML = html;
  $('#calSub').textContent = 'Today is ' + now.toLocaleDateString('en-GB',
    {weekday:'long',day:'numeric',month:'long'});
}
function paintSchedule(){
  const items = [
    {d:'2027-04-15', t:'Stockholm University', s:'application deadline', c:'var(--sea)'},
    {d:'2027-02-08', t:'Ramadan begins',       s:'plan the study load',  c:'var(--sand)'},
    {d:'2027-06-18', t:'Quran memorisation',   s:'projected finish',     c:'var(--sage)'}
  ];
  const now = new Date();
  $('#sched').innerHTML = items.map(i => {
    const days = Math.max(0, Math.round((new Date(i.d) - now)/86400000));
    return '<div class="rowline"><span class="dot" style="background:'+i.c+'"></span>' +
      '<span><div class="t1">'+i.t+'</div><div class="t2">'+i.s+'</div></span>' +
      '<span class="rt">'+days+' d</span></div>';
  }).join('');
}
function paintNav(){
  const nav = $('#nav'), mob = $('#mobbar');
  nav.innerHTML=''; mob.innerHTML='';
  NAV.forEach(n => {
    const a = document.createElement('button');
    a.dataset.id = n.id;
    a.innerHTML = '<span class="ic">'+n.icon+'</span>'+n.label;
    a.onclick = () => go(n.id);
    nav.appendChild(a);
    const b = document.createElement('button');
    b.dataset.id = n.id;
    b.innerHTML = '<span class="ic">'+n.icon+'</span>'+n.label.split(' ')[0];
    b.onclick = () => go(n.id);
    mob.appendChild(b);
  });
}
function go(id){
  const c = COURSES.find(x => x.id === id);
  if (c && !c.app){ $('#tagline').textContent = c.desc; return; }
  document.querySelectorAll('#nav button, #mobbar button')
    .forEach(b => b.setAttribute('aria-current', b.dataset.id === id));
  if (id === 'dash'){
    $('#dash').classList.remove('off');
    $('#view').classList.remove('on');
    $('#tagline').textContent = 'Welcome back \u2014 pick a course and carry on.';
    paintCards();
  } else if (c){
    $('#dash').classList.add('off');
    $('#view').classList.add('on');
    $('#vtitle').textContent = c.title;
    $('#tagline').textContent = c.desc;
    const file = c.app === 'oshima' ? 'oshima.html' : 'trainer.html';
    $('#openraw').href = file;
    const parked = document.getElementById('app-' + c.app);
    $('#openraw').style.display = parked ? 'none' : '';
    const load = $('#loading'), fr = $('#fr');
    load.classList.remove('gone');
    load.textContent = 'loading\u2026';
    fr.onload = () => load.classList.add('gone');
    const want = c.app + '|' + (c.go || '');
    if (fr.dataset.state !== want){
      fr.dataset.state = want;
      /* a short bootstrap is appended so the app opens on the right screen */
      const jump = c.go ? '<scr'+'ipt>window.addEventListener("load",function(){' +
        'setTimeout(function(){try{' + c.go + '}catch(e){}},450);});</scr'+'ipt>' : '';
      if (parked){
        fr.srcdoc = parked.textContent.replace('</body>', jump + '</body>');
      } else if (jump && typeof fetch === 'function'){
        fetch(file).then(r => r.text())
          .then(t => { fr.srcdoc = t.replace('</body>', jump + '</body>'); })
          .catch(() => { fr.src = file; });
      } else {
        fr.src = file;
      }
    } else {
      load.classList.add('gone');
    }
    setTimeout(function(){
      if (!load.classList.contains('gone'))
        load.innerHTML = '<div style="max-width:340px"><b>The courses live next to this page.</b><br>' +
          'Open the hub from its published address, or open <b>' + file +
          '</b> directly \u2014 a preview window cannot reach it.</div>';
    }, 5000);
  }
  try { localStorage.setItem('studyhub_last', id); } catch(e){}
  try { if (location.hash.slice(1) !== id) history.replaceState(null,'','#'+id); } catch(e){}
}
$('#back').onclick = () => go('dash');
$('#hello').innerHTML = greeting() + ', <span>Kausar</span>';
$('#datepill').textContent = new Date().toLocaleDateString('en-GB',
  {weekday:'long',day:'numeric',month:'long'});
$('#goal').textContent = Math.max(0,
  Math.round((new Date('2027-04-15') - new Date())/86400000)) + ' days to the SU deadline';
paintNav(); paintCalendar(); paintSchedule(); paintCards();
let start = 'dash';
try { start = location.hash.slice(1) || localStorage.getItem('studyhub_last') || 'dash'; } catch(e){}
if (!NAV.some(n => n.id === start)) start = 'dash';
